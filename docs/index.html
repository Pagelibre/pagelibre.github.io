function cmdTexte(nom, val) {
  appliquerTexte((z, tout) => {
    switch (nom) {
      case 'gras': document.execCommand('bold'); break;
      case 'italique': document.execCommand('italic'); break;
      case 'souligne': document.execCommand('underline'); break;
      case 'barre': document.execCommand('strikeThrough'); break;
      case 'exposant': document.execCommand('superscript'); break;
      case 'indice': document.execCommand('subscript'); break;
      case 'police': document.execCommand('fontName', false, val); break;
      case 'couleur': document.execCommand('foreColor', false, val); break;
      case 'surligne': document.execCommand('hiliteColor', false, val || 'transparent'); break;
      case 'effacer': document.execCommand('removeFormat'); break;
      case 'taille': appliquerTaille(z, val); break;
      case 'agrandir': case 'reduire': {
        const t = tailleCourante() || 11;
        const n = nom === 'agrandir' ? (TAILLES.find(x => x > t + 0.01) || t + 12) : ([...TAILLES].reverse().find(x => x < t - 0.01) || Math.max(1, t - 1));
        appliquerTaille(z, n);
        break;
      }
      case 'aligner': {
        for (const p of paragraphesVises(z, tout)) { if (val === 'left') p.style.removeProperty('text-align'); else p.style.textAlign = val; }
        break;
      }
      case 'interligne': for (const p of paragraphesVises(z, tout)) p.style.lineHeight = val; break;
      case 'retrait': {
        for (const p of paragraphesVises(z, tout)) {
          const v = Math.max(0, (parseFloat(p.style.marginLeft) || 0) + val);
          if (v) p.style.marginLeft = v + 'mm'; else p.style.removeProperty('margin-left');
        }
        break;
      }
      case 'puces': basculerPuces(paragraphesVises(z, tout), val); Rendu.numeroter(z); break;
      case 'paragraphe': for (const p of paragraphesVises(z, tout)) Object.assign(p.style, val); break;
    }

}

function appliquerTaille(z, pt) {
  pt = +pt;
  if (!pt) return;
  const s = window.getSelection();
  if (s.rangeCount && s.getRangeAt(0).collapsed) {
    // pas de sélection : on agit sur le paragraphe entier
    const r = s.getRangeAt(0);

    const p = n && n.closest('p');
    if (p) { const rr = document.createRange(); rr.selectNodeContents(p); s.removeAllRanges(); s.addRange(rr); }
  }
  document.execCommand('fontSize', false, '7');
  z.querySelectorAll('[style*="xxx-large"], font[size="7"]').forEach(e => {
    if (e.tagName === 'FONT') { const sp = document.createElement('span'); sp.append(...e.childNodes); e.replaceWith(sp); sp.style.fontSize = pt + 'pt'; }

  });
  z.querySelectorAll('.puce').forEach(pu => {
    const p = pu.closest('p');

    if (sp && sp.style.fontSize) pu.style.fontSize = sp.style.fontSize;

}

function basculerPuces(ps, type) {
  const avec = ps.length && ps.every(p => p.querySelector(':scope > .puce'));
  let n = 0;
  for (const p of ps) {
    const pu = p.querySelector(':scope > .puce');
    if (pu) pu.remove();
    if (avec) {
      p.style.removeProperty('margin-left');
      p.style.removeProperty('text-indent');
      continue;
    }
    n++;
    const s = document.createElement('span');
    s.className = 'puce';
    s.setAttribute('contenteditable', 'false');
    const premier = p.querySelector('span');
    if (premier) { s.style.fontFamily = premier.style.fontFamily; s.style.fontSize = premier.style.fontSize; s.style.color = premier.style.color; }
    s.textContent = (type === 'numeros' ? n + '.' : '•') + ' ';
    if (type === 'numeros') s.dataset.liste = 'num'; // numéro recalculé automatiquement
    p.insertBefore(s, p.firstChild);
    p.style.marginLeft = '6.35mm';
    p.style.textIndent = '-6.35mm';
  }
}

function tailleCourante() {

/* =====================================================================
   Éditeur : tableaux

const BORD_DEFAUT = { c: '#000000', e: 0.75 };

function insererTableau(nl, nc) {

  const w = Math.min(P.w - mg - md, nc * 30), hl = 8;
  const cols = Array(nc).fill(arrondi(w / nc)), lignes = Array(nl).fill(hl);
  const cellules = [];
  for (let l = 0; l < nl; l++) for (let c = 0; c < nc; c++) {
    cellules.push({ l, c, nl: 1, nc: 1, html: CEL_VIDE, bords: { h: { ...BORD_DEFAUT }, b: { ...BORD_DEFAUT }, g: { ...BORD_DEFAUT }, d: { ...BORD_DEFAUT } } });
  }
  const o = { id: nouvelId(), type: 'tableau', x: arrondi((P.w - w) / 2), y: arrondi(P.h / 3), w: arrondi(w), h: nl * hl, tableau: { cols, lignes, cellules, marges: [1, 1, 1, 1] } };

function grilleTableau(T) {

  T.cellules.forEach((c, i) => {
    for (let r = c.l; r < Math.min(c.l + c.nl, T.lignes.length); r++) for (let k = c.c; k < Math.min(c.c + c.nc, T.cols.length); k++) g[r][k] = i;
  });

}
function completerTableau(T) {
  const g = grilleTableau(T);
  g.forEach((ligne, r) => ligne.forEach((v, k) => { if (v < 0) T.cellules.push({ l: r, c: k, nl: 1, nc: 1, html: CEL_VIDE }); }));
}

function tableauEdite() {

}
function cellulesCibles(o) {

function modifierTableau(fn) {

function insLigne(apres_) {

    T.lignes.splice(r, 0, T.lignes[Math.min(modele, T.lignes.length - 1)]);
    const g = grilleTableau(T);
    for (let k = 0; k < T.cols.length; k++) {
      if (g[r][k] >= 0) continue;
      const voisin = T.cellules[g[apres_ ? r - 1 : r + 1] ? g[apres_ ? r - 1 : r + 1][k] : -1];
      T.cellules.push({ l: r, c: k, nl: 1, nc: 1, html: CEL_VIDE, bords: voisin && voisin.bords ? copie(voisin.bords) : undefined, fond: voisin && voisin.fond, vertical: voisin && voisin.vertical });

function insColonne(apres_) {

    const modele = apres_ ? ref.c + ref.nc - 1 : ref.c;
    for (const x of T.cellules) { if (x.c >= k0) x.c++; else if (x.c + x.nc > k0) x.nc++; }
    T.cols.splice(k0, 0, T.cols[Math.min(modele, T.cols.length - 1)]);
    const g = grilleTableau(T);
    for (let r = 0; r < T.lignes.length; r++) {

    }

}
function supLigne() {

  modifierTableau((o2, ref) => {

function supColonne() {

  modifierTableau((o2, ref) => {

/* ---- choix d'une plage de cellules (Maj+clic) ---- */
function plageDe(T, i1, i2) {
  const a = T.cellules[i1], b = T.cellules[i2];
  let r1 = Math.min(a.l, b.l), r2 = Math.max(a.l + a.nl, b.l + b.nl) - 1;
  let c1 = Math.min(a.c, b.c), c2 = Math.max(a.c + a.nc, b.c + b.nc) - 1;
  // élargir pour englober entièrement les cellules fusionnées
  let change = true;
  while (change) {
    change = false;
    for (const x of T.cellules) {
      const dedans = x.l <= r2 && x.l + x.nl - 1 >= r1 && x.c <= c2 && x.c + x.nc - 1 >= c1;
      if (!dedans) continue;
      if (x.l < r1) { r1 = x.l; change = true; }
      if (x.l + x.nl - 1 > r2) { r2 = x.l + x.nl - 1; change = true; }
      if (x.c < c1) { c1 = x.c; change = true; }
      if (x.c + x.nc - 1 > c2) { c2 = x.c + x.nc - 1; change = true; }
    }
  }
  return { r1, r2, c1, c2 };
}
function choisirPlageCellules(i1, i2) {
  const o = objetParId(E.edition.id);
  if (!o || o.type !== 'tableau') return;
  const p = plageDe(o.tableau, i1, i2);
  E.cellules = o.tableau.cellules.map((x, i) => i).filter(i => {
    const x = o.tableau.cellules[i];
    return x.l >= p.r1 && x.l <= p.r2 && x.c >= p.c1 && x.c <= p.c2;
  });
  E.plage = p;
  const el = elementObjet(o.id);
  $$('td[data-cellule]', el).forEach(td => td.classList.toggle('cel-choisie', E.cellules.includes(+td.dataset.cellule)));
  window.getSelection().removeAllRanges();
  majRuban();
}
function effacerChoixCellules() {

}

function fusionnerCellules() {
  const o = tableauEdite();
  if (!o || E.cellules.length < 2 || !E.plage) { alerte('Choisissez d\'abord plusieurs cellules : cliquez dans une cellule, puis Maj+clic dans une autre.'); return; }
  const p = E.plage, ids = new Set(E.cellules);
  modifierTableau((o2) => {
    const T = o2.tableau;

function bordures(mode, style) {
  style = style || E.styleBord || BORD_DEFAUT;
  changerCellules((T, ids) => {
    const set = new Set(ids);
    const cs = ids.map(i => T.cellules[i]);
    const r1 = Math.min(...cs.map(x => x.l)), r2 = Math.max(...cs.map(x => x.l + x.nl)), c1 = Math.min(...cs.map(x => x.c)), c2 = Math.max(...cs.map(x => x.c + x.nc));

    T.cellules.forEach((x, i) => {
      const dans = set.has(i);
      if (dans) {
        const ext = { h: x.l === r1, b: x.l + x.nl === r2, g: x.c === c1, d: x.c + x.nc === c2 };
        for (const cote of ['h', 'b', 'g', 'd']) {

          else if (mode === 'exterieures' && ext[cote]) poser(x, cote, s());
          else if (mode === 'interieures' && !ext[cote]) poser(x, cote, s());
          else if (mode === cote && ext[cote]) poser(x, cote, s());

      } else if (mode === 'aucune' || mode === 'toutes' || mode === 'exterieures') {

        if (chevaucheC && x.l === r2) poser(x, 'h', v);
        if (chevaucheL && x.c + x.nc === c1) poser(x, 'd', v);

function champActif() {

/* ---------------- souris ---------------- */
function surAppui(ev) {
  fermerMenu();
  if (ev.button === 1) return;
  const cible = ev.target;
  const elObj = cible.closest('#feuille-hote .calque-objets > .objet');
  if (ev.button === 2) {
    if (elObj && !E.sel.includes(elObj.dataset.id)) choisir(idsAvecGroupe(objetParId(elObj.dataset.id)));
    return;
  }
  if (interceptionAppui(ev, cible, elObj)) return;
  // saisie en cours : le clic dans le texte reste au navigateur
  if (E.edition) {
    const elE = elementObjet(E.edition.id);
    if (elE && elE.contains(cible) && cible.closest('[contenteditable="true"]')) {
      const td = cible.closest('td[data-cellule]');
      if (td && ev.shiftKey && E.celluleActive != null) { choisirPlageCellules(E.celluleActive, +td.dataset.cellule); ev.preventDefault(); }
      else if (td) effacerChoixCellules();
      return;
    }
  }
  const poignee = cible.closest('.poignee');
  if (poignee) { demarrerPoignee(ev, poignee.dataset.poignee); ev.preventDefault(); return; }
  if (E.dessin) { G = { type: 'dessin', p0: versMM(ev), x0: ev.clientX, y0: ev.clientY }; ev.preventDefault(); return; }
  // bord du cadre sélectionné : on le saisit pour le déplacer (même pendant la saisie)
  if (cible.closest('.bord-sel') && E.sel.length) {
    G = { type: 'deplacer', x0: ev.clientX, y0: ev.clientY, actif: false, origines: selection().map(x => ({ id: x.id, x: x.x, y: x.y })) };
    ev.preventDefault();
    return;
  }
  if (elObj) {
    const o = objetParId(elObj.dataset.id);
    if (!o) return;
    // comme en PAO : un clic dans le texte d'un cadre y place directement le curseur
    // (pour un cadre groupé, le premier clic choisit le groupe)
    if (accesDirectTexte(o) && !ev.shiftKey && !ev.ctrlKey && !surBordObjet(ev, o)) {
      if (!(E.edition && E.edition.id === o.id)) entrerEdition(o, null);
      return; // le navigateur place le curseur et gère la sélection au glisser
    }
    if (ev.shiftKey || ev.ctrlKey) {
      const ids = idsAvecGroupe(o);
      if (E.sel.includes(o.id)) choisir(E.sel.filter(id => !ids.includes(id)));
      else choisir(ids, true);
    }
    const dejaSeul = E.sel.length === 1 && E.sel[0] === o.id;
    const dansGroupeChoisi = E.sel.includes(o.id) && E.sel.length > 1 && groupeEntier(selection());
    if (!E.sel.includes(o.id)) choisir(idsAvecGroupe(o));
    if (E.edition && E.edition.id !== o.id) quitterEdition();
    G = {
      type: 'deplacer', x0: ev.clientX, y0: ev.clientY, actif: false,
      origines: selection().map(x => ({ id: x.id, x: x.x, y: x.y })),
      texte: dejaSeul && (o.type === 'texte' || o.type === 'tableau') ? o.id : null,
      sousSel: dansGroupeChoisi ? o.id : null
    };
    ev.preventDefault();
    $('#defile').focus({ preventScroll: true });
    return;
  }
  quitterEdition();
  if (!ev.shiftKey) { E.sel = []; majSelectionUI(); majRuban(); }
  G = { type: 'lasso', p0: versMM(ev), x0: ev.clientX, y0: ev.clientY, actif: false, base: [...E.sel] };
  $('#defile').focus({ preventScroll: true });
  ev.preventDefault();
}

// texte accessible d'un clic : cadre de texte ou tableau, non groupé ou dont le groupe est déjà choisi
function accesDirectTexte(o) {
  if (o.type !== 'texte' && o.type !== 'tableau') return false;

}
// le pointeur est-il sur le bord du cadre (zone de déplacement) ?

  const dx = p.x - (o.x + o.w / 2), dy = p.y - (o.y + o.h / 2);
  const lx = dx * c - dy * s + o.w / 2, ly = dx * s + dy * c + o.h / 2;
  const marge = Math.min(5 / (PX_MM * E.zoom), o.w * 0.2, o.h * 0.2);

}
function surSurvol(ev) {

  if (!elObj) return;

function demarrerPoignee(ev, nom) {
  const objs = selection();
  if (!objs.length) return;

  if (nom === 'a' || nom === 'b') {
    G = { type: 'extremite', nom, id: objs[0].id, p0, actif: false };
  } else if (nom === 'rot') {

    const c = { x: b.x + b.w / 2, y: b.y + b.h / 2 };

  } else {
    G = { type: 'redim', dir: nom, p0, origines: objs.map(copie), boite: objs.length === 1 ? null : boiteEnglobante(objs), actif: false };

function surDeplacement(ev) {

    if (Math.hypot(ev.clientX - G.x0, ev.clientY - G.y0) < 3) return;
    G.actif = true;
    if (G.type !== 'lasso' && G.type !== 'dessin') { avant(); if (E.edition) quitterEdition(); }
  }
  const p = versMM(ev);
  if (G.bouger) { G.bouger(p, ev); return; }
  const k = PX_MM * E.zoom;
  switch (G.type) {
    case 'deplacer': {
      let dx = (ev.clientX - G.x0) / k, dy = (ev.clientY - G.y0) / k;
      if (ev.shiftKey) { if (Math.abs(dx) > Math.abs(dy)) dy = 0; else dx = 0; }
      const objs = G.origines.map(g => objetParId(g.id));
      if (E.options.magnetisme && !ev.altKey) {
        const b0 = boiteEnglobante(objs.map((o, i) => Object.assign({}, o, { x: G.origines[i].x, y: G.origines[i].y })));
        const r = aimanter({ x: b0.x + dx, y: b0.y + dy, w: b0.w, h: b0.h }, new Set(E.sel));
        dx += r.dx; dy += r.dy;
      }

        const el = elementObjet(o.id);

        if (r < 0) r += 360;

          const cx = o0.x + o0.w / 2 - G.centre.x, cy = o0.y + o0.h / 2 - G.centre.y;
          o.x = arrondi(G.centre.x + cx * c - cy * s - o0.w / 2);

    }
    case 'extremite': {

function redimensionner(p, ev) {
  const dirs = { n: [0, -1], s: [0, 1], e: [1, 0], w: [-1, 0], ne: [1, -1], nw: [-1, -1], se: [1, 1], sw: [-1, 1] };

  const dxp = p.x - G.p0.x, dyp = p.y - G.p0.y;
  if (!G.boite) {
    const o0 = G.origines[0], o = objetParId(o0.id);

    const lx = dxp * c + dyp * s, ly = -dxp * s + dyp * c;

      w = o0.w * k; h = o0.h * k;
    }

    o.w = arrondi(w); o.h = arrondi(h); o.x = arrondi(cx - w / 2); o.y = arrondi(cy - h / 2);
    if (garder && (!sx || !sy)) { o.x = arrondi(cx - w / 2); o.y = arrondi(cy - h / 2); }

    redessinerObjet(o);
  } else {
    const b = G.boite;
    let x1 = b.x, y1 = b.y, x2 = b.x + b.w, y2 = b.y + b.h;

    for (const o0 of G.origines) {
      const o = objetParId(o0.id);
      o.x = arrondi(x1 + (o0.x - b.x) * kx); o.y = arrondi(y1 + (o0.y - b.y) * ky);
      o.w = arrondi(o0.w * kx); o.h = arrondi(o0.h * ky);

// tableau : les colonnes et lignes suivent le cadre

function surRelache(ev) {

function aimanter(b, exclus) {
  const tol = 6 / (PX_MM * E.zoom);
  const P = E.fiche.page, [mh, md, mb, mg] = P.marges;
  const cx = [0, P.w / 2, P.w, mg, P.w - md], cy = [0, P.h / 2, P.h, mh, P.h - mb];
  for (const g of P.guides || []) (g.sens === 'v' ? cx : cy).push(g.pos);
  const R = reperesGrille();
  cx.push(...R.v); cy.push(...R.h, ...R.base);
  for (const o of pageCourante().items) {
    if (exclus.has(o.id)) continue;
    const q = boiteEnglobante([o]);
    cx.push(q.x, q.x + q.w / 2, q.x + q.w);
    cy.push(q.y, q.y + q.h / 2, q.y + q.h);
  }
  const meilleur = (vals, cibles) => {
    let best = null;
    for (const v of vals) for (const c of cibles) {
      const d = c - v;
      if (Math.abs(d) <= tol && (!best || Math.abs(d) < Math.abs(best.d))) best = { d, c };
    }
    return best;
  };
  const bx = meilleur([b.x, b.x + b.w / 2, b.x + b.w], cx);
  const by = meilleur([b.y, b.y + b.h / 2, b.y + b.h], cy);
  nettoyerAides();
  const ui = $('#calque-ui');
  const k = PX_MM * E.zoom;
  if (bx) {
    const g = document.createElement('div'); g.className = 'guide-mag v';
    const p = mmVersScene(bx.c, 0); g.style.left = p.x + 'px'; g.style.top = (E.oy - 2000) + 'px'; g.style.height = (P.h * k + 4000) + 'px';
    ui.appendChild(g);
  }
  if (by) {
    const g = document.createElement('div'); g.className = 'guide-mag h';
    const p = mmVersScene(0, by.c); g.style.top = p.y + 'px'; g.style.left = (E.ox - 2000) + 'px'; g.style.width = (P.w * k + 4000) + 'px';
    ui.appendChild(g);
  }
  return { dx: bx ? bx.d : 0, dy: by ? by.d : 0 };
}

function nettoyerHTML(html) {
  const d = document.createElement('div');
  d.innerHTML = html;
  nettoyerAffichage(d);
  d.querySelectorAll('script,style,meta,link,iframe,object,.habillage').forEach(x => x.remove());
  d.querySelectorAll('*').forEach(x => {
    for (const a of [...x.attributes]) if (/^on/i.test(a.name) || (a.name === 'href' && /^\s*javascript:/i.test(a.value)) || (a.name === 'contenteditable' && !x.classList.contains('puce') && !x.classList.contains('champ-page'))) x.removeAttribute(a.name);
  });

  d.querySelectorAll(':scope > div').forEach(x => {

}

/* ---------------- clavier ---------------- */
function surTouche(ev) {
  const k = ev.key, ctrl = ev.ctrlKey || ev.metaKey;
  if (!$('#boite').hidden) {
    if (k === 'Escape') { fermerBoite(); ev.preventDefault(); }
    return;
  }
  if (!$('#menu').hidden && k === 'Escape') { fermerMenu(); ev.preventDefault(); return; }
  if (!$('#coulisses').hidden) { if (k === 'Escape') fermerCoulisses(); return; }
  // raccourcis toujours actifs
  if (ctrl && !ev.shiftKey && (k === 's' || k === 'S')) { ev.preventDefault(); commande('enregistrer'); return; }
  if (ctrl && (k === 'p' || k === 'P')) { ev.preventDefault(); commande('imprimer'); return; }
  if (ctrl && (k === 'o' || k === 'O')) { ev.preventDefault(); ouvrirCoulisses('ouvrir'); return; }
  // Ctrl + / Ctrl - / Ctrl 0 : zoom du document, pas du navigateur
  if (ctrl && !ev.altKey && (k === '+' || k === '=' || ev.code === 'NumpadAdd')) { ev.preventDefault(); definirZoom(E.zoom * 1.1); return; }
  if (ctrl && !ev.altKey && (k === '-' || ev.code === 'NumpadSubtract')) { ev.preventDefault(); definirZoom(E.zoom / 1.1); return; }
  if (ctrl && !ev.altKey && (k === '0' || k === 'à' || ev.code === 'Numpad0')) { ev.preventDefault(); zoomPage(); return; }
  if (champActif()) return;
  if (E.edition) {
    if (k === 'Escape') { const id = E.edition.id; quitterEdition(); E.sel = [id]; majSelectionUI(); ev.preventDefault(); return; }
    if (k === 'Tab') {
      const o = objetParId(E.edition.id);
      if (o && o.type === 'tableau') { ev.preventDefault(); celluleSuivante(o, ev.shiftKey ? -1 : 1); return; }
      ev.preventDefault();
      document.execCommand('insertText', false, '\t');
      return;
    }
    if (ctrl && (k === 'b' || k === 'B')) { ev.preventDefault(); commande('gras'); return; }
    if (ctrl && (k === 'i' || k === 'I')) { ev.preventDefault(); commande('italique'); return; }
    if (ctrl && (k === 'u' || k === 'U')) { ev.preventDefault(); commande('souligne'); return; }
    return; // le reste va au texte
  }
  if (E.dessin && k === 'Escape') { finDessin(); return; }
  if (ctrl) {
    switch (k.toLowerCase()) {
      case 'z': ev.preventDefault(); annuler(); return;
      case 'y': ev.preventDefault(); refaire(); return;
      case 'a': ev.preventDefault(); choisir(pageCourante().items.map(o => o.id)); return;
      case 'd': ev.preventDefault(); dupliquer(); return;
      case 'g': ev.preventDefault(); if (ev.shiftKey) dissocier(); else grouper(); return;
      case 'b': ev.preventDefault(); commande('gras'); return;
      case 'i': ev.preventDefault(); commande('italique'); return;
      case 'u': ev.preventDefault(); commande('souligne'); return;
      case 'n': ev.preventDefault(); ouvrirCoulisses('nouveau'); return;
    }
    if (k === 'PageDown') { ev.preventDefault(); allerPage(E.ip + 1); return; }
    if (k === 'PageUp') { ev.preventDefault(); allerPage(E.ip - 1); return; }
    return;
  }
  if (k === 'PageDown' && !E.sel.length) { allerPage(E.ip + 1); ev.preventDefault(); return; }
  if (k === 'PageUp' && !E.sel.length) { allerPage(E.ip - 1); ev.preventDefault(); return; }
  if (k === 'F9') { ev.preventDefault(); definirZoom(1); return; }
  if (!E.sel.length) return;
  if (k === 'Delete' || k === 'Backspace') { ev.preventDefault(); supprimerSelection(); return; }
  if (k === 'Escape') { deselectionner(); return; }
  const fleches = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  if (fleches[k]) {
    ev.preventDefault();
    const pas = ev.shiftKey ? 5 : ev.altKey ? 0.2 : 1;
    avant();
    for (const o of selection()) { o.x = arrondi(o.x + fleches[k][0] * pas); o.y = arrondi(o.y + fleches[k][1] * pas); const el = elementObjet(o.id); if (el) { el.style.left = o.x + 'mm'; el.style.top = o.y + 'mm'; } }
    apres();
    return;
  }
  if (k === 'Enter' || k === 'F2') {
    const s = selection();
    if (s.length === 1 && (s[0].type === 'texte' || s[0].type === 'tableau')) { ev.preventDefault(); entrerEdition(s[0]); }
    return;
  }
  // une lettre tapée sur une zone de texte sélectionnée : on commence la saisie
  if (k.length === 1 && !ev.altKey) {
    const s = selection();
    if (s.length === 1 && s[0].type === 'texte') entrerEdition(s[0]);
  }
}

/* ---------------- presse-papiers ---------------- */
function copier() {

  const objs = copie(selection());
  E.presse = { objets: objs, page: E.ip, n: 0 };
  try { navigator.clipboard.writeText(objs.map(o => (o.html || '').replace(/<\/p>/g, '\n').replace(/<[^>]+>/g, '')).join('\n').trim()); } catch (e) { /* facultatif */ }
}
function couper() { copier(); supprimerSelection(); }
function collerInterne() {
  if (!E.presse) return false;

  E.presse.n++;
  const decal = E.presse.page === E.ip ? 4 * E.presse.n : 0;
  const objs = copie(E.presse.objets);
  renommerGroupes(objs);
  for (const o of objs) {
    delete o.suivant; delete o.precedent;
    if (o.htmlComplet != null) { o.html = o.htmlComplet; delete o.htmlComplet; }
    o.id = nouvelId(); o.x = arrondi(o.x + decal); o.y = arrondi(o.y + decal); pageCourante().items.push(o); redessinerObjet(o); }
  E.sel = objs.map(o => o.id);
  apres();
  return true;
}
function surColler(ev) {
  if (E.edition) {
    // dans un texte : texte brut seulement (garde la mise en forme de la fiche)
    const t = ev.clipboardData && ev.clipboardData.getData('text/plain');
    const img = ev.clipboardData && [...ev.clipboardData.files].find(f => f.type.startsWith('image/'));
    ev.preventDefault();
    if (img) { quitterEdition(); insererImageFichier(img); return; }
    if (t) document.execCommand('insertText', false, t);
    return;
  }
  if (champActif()) return;
  const cd = ev.clipboardData;
  const img = cd && [...cd.files].find(f => f.type.startsWith('image/'));
  ev.preventDefault();
  if (img) { insererImageFichier(img); return; }
  const t = cd && cd.getData('text/plain');
  if (E.presse && (!t || t.trim() === presseTexte())) { collerInterne(); return; }
  if (t && t.trim()) { insererTexteBrut(t); return; }
  collerInterne();
}
function presseTexte() {
  return E.presse ? E.presse.objets.map(o => (o.html || '').replace(/<\/p>/g, '\n').replace(/<[^>]+>/g, '')).join('\n').trim() : '';
}
async function collerDepuisBouton() {
  if (E.presse && collerInterne()) return;
  try {
    const items = await navigator.clipboard.read();
    for (const it of items) {
      const ti = it.types.find(t => t.startsWith('image/'));
      if (ti) { insererImageFichier(await it.getType(ti)); return; }
      if (it.types.includes('text/plain')) { insererTexteBrut(await (await it.getType('text/plain')).text()); return; }
    }
  } catch (e) { alerte('Le navigateur ne donne pas accès au presse-papiers depuis ce bouton : utilisez Ctrl+V.'); }
}
function insererTexteBrut(t) {

  const o = { id: nouvelId(), type: 'texte', forme: 'rect', x: arrondi(P.w / 2 - 50), y: arrondi(P.h / 3), w: 100, h: 30, marges: [1, 1, 1, 1], vertical: 'haut', html };

/* ---------------- organisation ---------------- */
function supprimerSelection() {

function ordre(mode) {
  const items = pageCourante().items, ids = new Set(E.sel);
  if (!ids.size) return;

  const choisis = items.filter(o => ids.has(o.id)), autres = items.filter(o => !ids.has(o.id));
  if (mode === 'premier') pageCourante().items = [...autres, ...choisis];
  else if (mode === 'arriere') pageCourante().items = [...choisis, ...autres];
  else if (mode === 'avancer' || mode === 'reculer') {
    const t = [...items];
    const pas = mode === 'avancer' ? 1 : -1;
    const ordreIdx = t.map((o, i) => i).filter(i => ids.has(t[i].id));
    if (pas > 0) ordreIdx.reverse();
    for (const i of ordreIdx) {
      const j = i + pas;
      if (j >= 0 && j < t.length && !ids.has(t[j].id)) [t[i], t[j]] = [t[j], t[i]];
    }
    pageCourante().items = t;
  }

function aligner(mode) {

  if (!s.length) return;

  const ref = s.length === 1 ? { x: 0, y: 0, w: E.fiche.page.w, h: E.fiche.page.h } : boiteEnglobante(s);

    if (blocs.length < 3) { E.histo.pop(); return; }
    blocs.sort((a, b) => h ? a.b.x - b.b.x : a.b.y - b.b.y);
    const total = blocs.reduce((t, x) => t + (h ? x.b.w : x.b.h), 0);
    const espace = ((h ? ref.w : ref.h) - total) / (blocs.length - 1);
    let pos = h ? ref.x : ref.y;
    for (const bl of blocs) { decaler(bl.objs, h ? pos - bl.b.x : 0, h ? 0 : pos - bl.b.y); pos += (h ? bl.b.w : bl.b.h) + espace; }

    for (const bl of blocs) {
      const b = bl.b;
      let dx = 0, dy = 0;
      if (mode === 'gauche') dx = ref.x - b.x;
      if (mode === 'centreH') dx = ref.x + ref.w / 2 - (b.x + b.w / 2);
      if (mode === 'droite') dx = ref.x + ref.w - (b.x + b.w);
      if (mode === 'haut') dy = ref.y - b.y;
      if (mode === 'milieu') dy = ref.y + ref.h / 2 - (b.y + b.h / 2);

/* ---------------- insertion par dessin ---------------- */
function demarrerModeDessin(spec) {
  quitterEdition();
  E.dessin = spec;
  document.body.classList.add('mode-dessin');
  indication('Tracez l\'objet sur la page (cliquez-glissez). Échap pour annuler.');
}
function finDessin() {
  E.dessin = null;
  document.body.classList.remove('mode-dessin');
  indication(null);
}
function terminerDessin(p0, p1, ev) {
  const spec = E.dessin;
  finDessin();
  if (!spec) return;
  let x, y, w, h;
  const defaut = { texte: [70, 25], forme: [30, 30], ligne: [40, 0] }[spec.type] || [30, 30];
  if (!p1 || (Math.abs(p1.x - p0.x) < 1.5 && Math.abs(p1.y - p0.y) < 1.5)) {
    x = p0.x; y = p0.y; w = defaut[0]; h = defaut[1];
    p1 = { x: x + w, y: y + h };
  } else {
    x = Math.min(p0.x, p1.x); y = Math.min(p0.y, p1.y); w = Math.abs(p1.x - p0.x); h = Math.abs(p1.y - p0.y);
  }
  let o;
  if (spec.type === 'texte') {
    o = { type: 'texte', forme: 'rect', marges: [1, 1, 1, 1], vertical: 'haut', html: '<p><span style="font-family:\'Calibri\';font-size:11pt"><br></span></p>' };
  } else if (spec.type === 'ligne') {
    o = { type: 'ligne', trait: { couleur: '#000000', epaisseur: 1, flecheFin: spec.fleche ? 1 : undefined } };
    if (!spec.fleche) delete o.trait.flecheFin;
    o.id = nouvelId();
    if (ev && ev.shiftKey) {
      const ang = Math.round(Math.atan2(p1.y - p0.y, p1.x - p0.x) / (Math.PI / 4)) * Math.PI / 4, L = Math.hypot(p1.x - p0.x, p1.y - p0.y);
      p1 = { x: p0.x + Math.cos(ang) * L, y: p0.y + Math.sin(ang) * L };
    }
    ligneDepuisPoints(o, [p0.x, p0.y], [p1.x, p1.y]);
  } else {
    o = { type: 'forme', forme: spec.forme || 'rect', fond: { couleur: '#5b9bd5' }, trait: { couleur: '#41719c', epaisseur: 1 } };
  }
  o.id = o.id || nouvelId();
  if (spec.type !== 'ligne') { o.x = arrondi(x); o.y = arrondi(y); o.w = arrondi(Math.max(w, 2)); o.h = arrondi(Math.max(h, 2)); }
  avant();
  pageCourante().items.push(o);
  redessinerObjet(o);
  E.sel = [o.id];
  apres();
  if (o.type === 'texte') entrerEdition(o);
}

/* ---------------- glisser-déposer de fichiers ---------------- */
function initDepot() {
  let n = 0;
  const voile = $('#glisser-ici');
  window.addEventListener('dragenter', ev => { if ([...ev.dataTransfer.types].includes('Files')) { n++; voile.hidden = false; ev.preventDefault(); } });
  window.addEventListener('dragleave', () => { n = Math.max(0, n - 1); if (!n) voile.hidden = true; });
  window.addEventListener('dragover', ev => { if ([...ev.dataTransfer.types].includes('Files')) ev.preventDefault(); });
  window.addEventListener('drop', ev => {
    n = 0; voile.hidden = true;
    const f = ev.dataTransfer.files && ev.dataTransfer.files[0];
    if (!f) return;
    ev.preventDefault();
    if (f.type.startsWith('image/')) { insererImageFichier(f, E.feuille ? versMM(ev) : null); return; }
    // Edge donne aussi la « poignée » du fichier : on pourra enregistrer au même endroit
    const item = [...ev.dataTransfer.items].find(i => i.kind === 'file');
    const promesse = item && item.getAsFileSystemHandle ? item.getAsFileSystemHandle().catch(() => null) : Promise.resolve(null);
    promesse.then(p => {
      if (p) noterRecent(p);
      ouvrirFichier(f, p && /\.html?$/i.test(f.name) ? p : null);
    });
  });
}

function champTaillePosition(id, v) {
  const n = parseFloat(String(v).replace(',', '.').replace(/[^\d.-]/g, ''));
  if (!Number.isFinite(n)) { majChampsTaille(); return; }
  if (id === 'c-hl') { dimensionLigneColonne('ligne', n * 10); return; }
  if (id === 'c-lc') { dimensionLigneColonne('colonne', n * 10); return; }
  const s = selection();
  if (!s.length) return;
  avant();
  if (id === 'c-rot') {
    for (const o of s) { const r = ((n % 360) + 360) % 360; if (r) o.rot = r; else delete o.rot; redessinerObjet(o); }
  } else if (s.length === 1) {
    const o = s[0], ancien = copie(o);
    const mmv = n * 10;
    if (id === 'c-h' && mmv > 0) o.h = arrondi(mmv);
    if (id === 'c-w' && mmv > 0) o.w = arrondi(mmv);
    if (id === 'c-x') o.x = arrondi(mmv);
    if (id === 'c-y') o.y = arrondi(mmv);
    echelleInterne(o, ancien);
    redessinerObjet(o);
  } else {
    const b = boiteEnglobante(s), mmv = n * 10;
    const kx = id === 'c-w' && mmv > 0 ? mmv / b.w : 1, ky = id === 'c-h' && mmv > 0 ? mmv / b.h : 1;
    const dx = id === 'c-x' ? mmv - b.x : 0, dy = id === 'c-y' ? mmv - b.y : 0;
    for (const o of s) {
      const ancien = copie(o);
      o.x = arrondi(b.x + (o.x - b.x) * kx + dx); o.y = arrondi(b.y + (o.y - b.y) * ky + dy);
      o.w = arrondi(o.w * kx); o.h = arrondi(o.h * ky);
      echelleInterne(o, ancien);
      redessinerObjet(o);
    }
  }
  apres();
}

function ouvrirMenu(pos, items, html) {
  const m = $('#menu');

  for (const it of items || []) {
    if (it === '-') { m.insertAdjacentHTML('beforeend', '<div class="menu-sep"></div>'); continue; }
    if (it.titre) { m.insertAdjacentHTML('beforeend', `<div class="menu-titre">${esc(it.titre)}</div>`); continue; }
    const b = document.createElement('button');
    b.className = 'menu-item' + (it.off ? ' desactive' : '');
    b.innerHTML = `<span class="ic">${it.ic ? ic(it.ic) : it.coche ? '✓' : ''}</span><span>${esc(it.lib)}</span>${it.rac ? `<span class="raccourci">${it.rac}</span>` : ''}`;
    b.addEventListener('mousedown', ev => ev.preventDefault());
    b.addEventListener('click', () => { fermerMenu(); it.act(); });
    m.appendChild(b);
  }
  m.hidden = false;
  const r = m.getBoundingClientRect();
  let x = pos.x, y = pos.y;
  if (x + r.width > innerWidth - 4) x = innerWidth - r.width - 4;
  if (y + r.height > innerHeight - 4) y = Math.max(4, innerHeight - r.height - 4);
  m.style.left = x + 'px';
  m.style.top = y + 'px';
  setTimeout(() => document.addEventListener('mousedown', fermerMenuDehors, true), 0);
}

/* ---------------- boîtes de dialogue ---------------- */
function ouvrirBoite(titre, corps, surOK, opt = {}) {
  const b = $('#boite');
  b.innerHTML = `<div class="boite-titre"><span>${esc(titre)}</span><button data-x title="Fermer">✕</button></div>
    <div class="boite-corps">${corps}</div>
    <div class="boite-pied">${opt.sansAnnuler ? '' : '<button class="bouton" data-annuler>Annuler</button>'}<button class="bouton principal" data-ok>${esc(opt.ok || 'OK')}</button></div>`;
  b.hidden = false;
  $('#voile').hidden = false;
  const fermer = () => fermerBoite();
  $('[data-x]', b).onclick = fermer;
  const a = $('[data-annuler]', b);
  if (a) a.onclick = fermer;
  $('[data-ok]', b).onclick = () => { const r = surOK ? surOK() : true; if (r !== false) fermer(); };
  b.onkeydown = ev => { if (ev.key === 'Enter' && ev.target.tagName !== 'TEXTAREA') { ev.preventDefault(); $('[data-ok]', b).click(); } };
  const premier = $('input,select,textarea', b) || $('[data-ok]', b);
  setTimeout(() => premier.focus(), 0);
}
function fermerBoite() { $('#boite').hidden = true; $('#voile').hidden = true; }
function alerte(msg) { ouvrirBoite('PageLibre', `<p style="max-width:440px">${esc(msg)}</p>`, null, { sansAnnuler: true }); }
function confirmer(msg, ok) { ouvrirBoite('Confirmation', `<p style="max-width:440px">${esc(msg)}</p>`, () => { ok(); }, { ok: 'Oui' }); }
function indication(msg) {
  const b = $('#bandeau');
  if (!msg) { if (b.dataset.type === 'indication') b.hidden = true; return; }
  b.dataset.type = 'indication';
  b.innerHTML = `<span>${esc(msg)}</span><button class="bouton">Annuler</button>`;
  $('button', b).onclick = () => finDessin();
  b.hidden = false;
}

/* ---- images ---- */
function choisirFichierImage(fn) {
  const i = $('#entree-fichier');
  i.value = '';
  i.accept = 'image/*';
  i.onchange = () => { if (i.files[0]) fn(i.files[0]); };
  i.click();
}
function insererImage() { choisirFichierImage(f => insererImageFichier(f)); }
function lireImage(fichier) {
  return new Promise((ok, ko) => {
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        let url = r.result, w = img.naturalWidth, h = img.naturalHeight;
        const max = 2400;
        if (Math.max(w, h) > max) {
          // photo trop lourde : on la réduit (la fiche reste légère)
          const k = max / Math.max(w, h);
          const c = document.createElement('canvas');
          c.width = Math.round(w * k); c.height = Math.round(h * k);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          url = fichier.type === 'image/png' ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', 0.88);
          w = c.width; h = c.height;
        }
        ok({ url, w, h });
      };
      img.onerror = () => ko(new Error('Image illisible'));

async function insererImageFichier(fichier, pos) {

    E.fiche.images[ref] = im.url;

    if (h > P.h * 0.6) { h = P.h * 0.6; w = h * im.w / im.h; }

}

      const cx = o.x + o.w / 2, cy = o.y + o.h / 2;
      o.h = arrondi(o.w * im.h / im.w);
      o.y = arrondi(cy - o.h / 2); o.x = arrondi(cx - o.w / 2);

}
function proportionsOrigine() {
  const objs = selection().filter(x => x.type === 'image' && E.fiche.images[x.image]);
  if (!objs.length) return;
  let n = objs.length;
  const maj = [];
  for (const o of objs) {
    const img = new Image();
    img.onload = () => {
      const r = o.rognage || [0, 0, 0, 0];
      const vw = img.naturalWidth * (1 - r[1] - r[3]), vh = img.naturalHeight * (1 - r[0] - r[2]);

        for (const [ob, w, h] of maj) { const cy = ob.y + ob.h / 2; ob.h = arrondi(ob.w * h / w); ob.y = arrondi(cy - ob.h / 2); redessinerObjet(ob); }

   Éditeur : fonctions avancées (comme en PAO)
   rognage à la souris, cadres chaînés, pinceau, guides de règle, styles,

/* ---------------- interceptions de la souris ---------------- */
// appelée au début de surAppui ; renvoie true si le clic est traité ici
function interceptionAppui(ev, cible, elObj) {
  // guides de règle
  const gd = cible.closest('.guide-regle');
  if (gd) { demarrerGuide(ev, gd.dataset.guide.length ? +gd.dataset.guide : null, null); return true; }
  // mode « créer un lien » : on clique sur la zone de texte qui recevra la suite
  if (E.lien) {
    const o = elObj && objetParId(elObj.dataset.id);
    ev.preventDefault();
    terminerLien(o);
    return true;
  }
  // pinceau : on clique sur l'objet qui reçoit la mise en forme
  if (E.pinceau && elObj && !(E.edition && E.edition.id === elObj.dataset.id)) {
    const o = objetParId(elObj.dataset.id);
    if (o) { ev.preventDefault(); appliquerPinceauObjet(o); return true; }
  }
  // rognage
  const pr = cible.closest('[data-rog]');
  if (pr && E.rognage) { demarrerRognage(ev, pr.dataset.rog); return true; }
  if (E.rognage && !cible.closest('[data-rog]')) quitterRognage();
  // séparateurs de colonnes / lignes de tableau
  const sep = cible.closest('[data-sep]');
  if (sep) { demarrerSeparateur(ev, sep.dataset.sep, +sep.dataset.k); return true; }
  return false;
}

// éléments ajoutés au calque de sélection
function extrasSelectionUI(ui, objs) {
  if (E.rognage && !(objs.length === 1 && objs[0].id === E.rognage)) E.rognage = null;
  if (objs.length !== 1) return;
  const o = objs[0];
  if (E.rognage && o.type === 'image') ui.appendChild(calqueRognage(o));
  if (o.type === 'tableau') ui.appendChild(calqueSeparateurs(o));
}
function cadreLocal(o, cls) {
  const k = PX_MM * E.zoom, p = mmVersScene(o.x, o.y);
  const d = document.createElement('div');
  d.className = cls;
  d.style.cssText = `position:absolute;left:${p.x}px;top:${p.y}px;width:${o.w * k}px;height:${o.h * k}px;transform:${o.rot ? `rotate(${o.rot}deg)` : 'none'};transform-origin:50% 50%`;
  return d;
}
// geste générique : décalage local (dans le repère de l'objet tourné)
function deltaLocal(o0, p, p0) {
  const r = (o0.rot || 0) * Math.PI / 180, c = Math.cos(r), s = Math.sin(r);
  const dx = p.x - p0.x, dy = p.y - p0.y;
  return { lx: dx * c + dy * s, ly: -dx * s + dy * c };
}
// place un cadre redimensionné en gardant fixe le côté opposé
function placerCadre(o, o0, w, h, sx, sy) {
  const r = (o0.rot || 0) * Math.PI / 180, c = Math.cos(r), s = Math.sin(r);
  const cx0 = o0.x + o0.w / 2, cy0 = o0.y + o0.h / 2;
  const fx = -sx * o0.w / 2, fy = -sy * o0.h / 2;
  const Fx = cx0 + fx * c - fy * s, Fy = cy0 + fx * s + fy * c;
  const nx = sx ? -sx * w / 2 : 0, ny = sy ? -sy * h / 2 : 0;
  const cx = Fx - (nx * c - ny * s), cy = Fy - (nx * s + ny * c);
  o.w = arrondi(w); o.h = arrondi(h); o.x = arrondi(cx - w / 2); o.y = arrondi(cy - h / 2);
}

/* ---------------- 1. rognage à la souris ---------------- */
function basculerRognage() {
  const o = selection().find(x => x.type === 'image');
  if (!o) return;
  if (E.rognage === o.id) { quitterRognage(); return; }
  E.sel = [o.id];
  E.rognage = o.id;
  indicationModes('Rognage : tirez les poignées noires pour rogner, faites glisser l\'image pour la recadrer. Échap pour terminer.');
  majSelectionUI();
  majRuban();
}
function quitterRognage() {
  if (!E.rognage) return;
  E.rognage = null;
  indicationModes(null);
  majSelectionUI();
  majRuban();
}
function calqueRognage(o) {
  const d = cadreLocal(o, 'calque-rognage');
  const [t, r, b, l] = o.rognage || [0, 0, 0, 0];
  const W = 1 / (1 - l - r), H = 1 / (1 - t - b);
  const f = document.createElement('div');
  f.className = 'fantome-rog';
  f.dataset.rog = 'pan';
  f.style.cssText = `left:${-l * W * 100}%;top:${-t * H * 100}%;width:${W * 100}%;height:${H * 100}%`;
  const src = E.fiche.images[o.image];
  if (src) { const im = document.createElement('img'); im.src = src; im.draggable = false; f.appendChild(im); }
  d.appendChild(f);
  const fen = document.createElement('div');
  fen.className = 'fenetre-rog';
  fen.dataset.rog = 'pan';
  d.appendChild(fen);
  const pos = { nw: [0, 0], n: [50, 0], ne: [100, 0], e: [100, 50], se: [100, 100], s: [50, 100], sw: [0, 100], w: [0, 50] };
  for (const nom in pos) {
    const h = document.createElement('div');
    h.className = 'poignee-rog r-' + nom;
    h.dataset.rog = nom;
    h.style.left = pos[nom][0] + '%';
    h.style.top = pos[nom][1] + '%';
    d.appendChild(h);
  }
  return d;
}
function demarrerRognage(ev, dir) {
  const o = objetParId(E.rognage);
  if (!o) return;
  ev.preventDefault();
  const o0 = copie(o), p0 = versMM(ev);
  const [t0, r0, b0, l0] = o0.rognage || [0, 0, 0, 0];
  const W0 = o0.w / (1 - l0 - r0), H0 = o0.h / (1 - t0 - b0);
  const dirs = { n: [0, -1], s: [0, 1], e: [1, 0], w: [-1, 0], ne: [1, -1], nw: [-1, -1], se: [1, 1], sw: [-1, 1] };
  G = {
    type: 'rogner', x0: ev.clientX, y0: ev.clientY, actif: false,
    bouger(p) {
      const { lx, ly } = deltaLocal(o0, p, p0);
      let t = t0, r = r0, b = b0, l = l0;
      if (dir === 'pan') {
        const dl = Math.max(-l0, Math.min(r0, -lx / W0)), dt = Math.max(-t0, Math.min(b0, -ly / H0));
        l = l0 + dl; r = r0 - dl; t = t0 + dt; b = b0 - dt;
        o.rognage = [t, r, b, l].map(v => arrondi(v, 4));
        redessinerObjet(o);
        majSelectionUI();
        return;
      }
      const [sx, sy] = dirs[dir];
      if (sx < 0) l = Math.max(0, Math.min(1 - r - 0.03, l0 + lx / W0));
      if (sx > 0) r = Math.max(0, Math.min(1 - l - 0.03, r0 - lx / W0));
      if (sy < 0) t = Math.max(0, Math.min(1 - b - 0.03, t0 + ly / H0));
      if (sy > 0) b = Math.max(0, Math.min(1 - t - 0.03, b0 - ly / H0));
      placerCadre(o, o0, W0 * (1 - l - r), H0 * (1 - t - b), sx, sy);
      if (t || r || b || l) o.rognage = [t, r, b, l].map(v => arrondi(v, 4)); else delete o.rognage;
      redessinerObjet(o);
      majSelectionUI();
    }
  };
}

/* ---------------- 2. cadres chaînés (le texte continue d'un cadre à l'autre) ---------------- */
function tousLesObjets() {
  const m = new Map();
  for (const p of [...E.fiche.pages, ...Object.values(E.fiche.maitres)]) for (const x of p.items) m.set(x.id, x);
  return m;
}
function chaineDe(o, tous) {
  tous = tous || tousLesObjets();
  let tete = o, garde = 0;
  while (tete.precedent && tous.get(tete.precedent) && garde++ < 200) tete = tous.get(tete.precedent);
  const l = [tete];
  let c = tete;
  while (c.suivant && tous.get(c.suivant) && l.length < 200) { c = tous.get(c.suivant); if (l.includes(c)) break; l.push(c); }
  return l;
}
// recolle les morceaux de paragraphe coupés entre deux cadres
function recoller(html) {
  const d = document.createElement('div');
  d.innerHTML = html;
  for (const p of [...d.querySelectorAll(':scope > [data-coupe]')]) {
    const n = p.nextElementSibling;
    if (n && n.hasAttribute('data-suite')) { while (n.firstChild) p.appendChild(n.firstChild); n.remove(); }
    p.removeAttribute('data-coupe');
  }
  d.querySelectorAll('[data-suite]').forEach(p => { p.removeAttribute('data-suite'); p.style.removeProperty('text-indent'); });
  d.querySelectorAll('[data-coupe]').forEach(p => p.removeAttribute('data-coupe'));
  return d.innerHTML;
}
function texteCompletChaine(chaine) {
  return recoller(chaine.map(x => x.html || '').join(''));
}
let hoteMesure = null;
function mesureHote() {
  if (!hoteMesure) {
    hoteMesure = document.createElement('div');
    hoteMesure.style.cssText = 'position:fixed;left:-20000px;top:0;visibility:hidden;pointer-events:none';
    hoteMesure.className = 'feuille';
    document.body.appendChild(hoteMesure);
  }
  hoteMesure.style.width = E.fiche.page.w + 'mm';
  hoteMesure.style.height = E.fiche.page.h + 'mm';
  return hoteMesure;
}
function couperParagraphe(p, z, dispo) {
  const pos = [];
  const tw = document.createTreeWalker(p, NodeFilter.SHOW_TEXT);
  for (let n = tw.nextNode(); n; n = tw.nextNode()) {
    const t = n.nodeValue;
    for (let i = 0; i < t.length; i++) if (t[i] === ' ' || t[i] === ' ' || t[i] === '\t') pos.push([n, i + 1]);
  }
  if (!pos.length) return null;
  const morceau = (debut, fin) => {
    const r = document.createRange();
    if (debut) r.setStart(debut[0], debut[1]); else r.setStart(p, 0);
    if (fin) r.setEnd(fin[0], fin[1]); else r.setEnd(p, p.childNodes.length);
    const e = p.cloneNode(false);
    e.appendChild(r.cloneContents());
    return e;
  };
  let lo = -1, hi = pos.length - 1;
  while (lo < hi) {
    const m = Math.ceil((lo + hi + 1) / 2);
    const e = morceau(null, pos[m]);
    z.appendChild(e);
    const ok = z.scrollHeight <= dispo + 1;
    e.remove();
    if (ok) lo = m; else hi = m - 1;
  }
  if (lo < 0) return null;
  const a = morceau(null, pos[lo]), b = morceau(pos[lo], null);
  a.setAttribute('data-coupe', '1');
  b.setAttribute('data-suite', '1');
  b.style.textIndent = '0';
  b.querySelectorAll('.puce,.lettrine').forEach(x => x.remove());
  return [a, b];
}
function refluerChaine(chaine) {
  const tete = chaine[0];
  if (tete.htmlComplet == null) tete.htmlComplet = texteCompletChaine(chaine);
  const hote = mesureHote();
  const src = document.createElement('div');
  src.innerHTML = tete.htmlComplet;
  let reste = [...src.childNodes].filter(n => n.nodeType === 1 || (n.nodeType === 3 && n.nodeValue.trim()));
  chaine.forEach((box, i) => {
    const el = Rendu.objet(Object.assign({}, box, { html: '', ajustement: undefined, rot: 0 }), E.fiche, {});
    hote.appendChild(el);
    const z = el.querySelector('.contenu');
    z.innerHTML = '';
    if (i === chaine.length - 1) {
      reste.forEach(n => z.appendChild(n));
      reste = [];
    } else {
      const dispo = hauteurUtile(el);
      while (reste.length) {
        const n = reste[0];
        z.appendChild(n);
        if (z.scrollHeight <= dispo + 1) { reste.shift(); continue; }
        n.remove();
        const coupe = n.tagName === 'P' ? couperParagraphe(n, z, dispo) : null;
        if (coupe) { z.appendChild(coupe[0]); reste[0] = coupe[1]; }
        else if (!z.childNodes.length && i === 0) { z.appendChild(n); reste.shift(); }
        break;
      }
    }
    box.html = z.innerHTML || '<p><br></p>';
    el.remove();
  });
}
function refluerChaines() {
  const tous = tousLesObjets();
  const fait = new Set();
  for (const o of tous.values()) {
    if (!o.suivant || o.precedent || fait.has(o.id)) continue;
    const ch = chaineDe(o, tous);
    ch.forEach(x => fait.add(x.id));
    if (E.edition && ch.some(x => x.id === E.edition.id)) continue;
    refluerChaine(ch);
    for (const x of ch) if (elementObjet(x.id)) redessinerObjetSimple(x);
  }
}
function redessinerObjetSimple(o) {
  const a = elementObjet(o.id);
  if (!a) return;
  const n = Rendu.objet(o, E.fiche, ctxObjet(o));
  if (a.classList.contains('choisi')) n.classList.add('choisi');

}
// après la saisie dans un cadre chaîné : on refait le texte complet puis la répartition
function apresSaisieChaine(o) {
  if (!o.suivant && !o.precedent) return;
  const ch = chaineDe(o);
  ch[0].htmlComplet = texteCompletChaine(ch);

}
function creerLien() {

  quitterEdition();
  E.lien = o.id;

}
function terminerLien(cible) {

  if (!cible || !src) return;
  if (cible.type !== 'texte' || cible.id === src.id) { alerte('Choisissez une autre zone de texte.'); return; }
  if (cible.precedent || cible.suivant) { alerte('Cette zone de texte fait déjà partie d\'un enchaînement.'); return; }
  if ((cible.html || '').replace(/<[^>]+>/g, '').trim()) { alerte('La zone de texte de destination doit être vide.'); return; }
  avant();
  const ch = chaineDe(src);
  ch[0].htmlComplet = texteCompletChaine(ch);
  src.suivant = cible.id;
  cible.precedent = src.id;

function romprelien() {

  quitterEdition();
  avant();
  const tous = tousLesObjets();
  const ch = chaineDe(o, tous);
  const complet = texteCompletChaine(ch);
  const i = ch.indexOf(o);
  const suite = tous.get(o.suivant);
  delete o.suivant;
  if (suite) delete suite.precedent;
  // le texte revient dans la première partie ; les cadres détachés se vident
  ch[0].htmlComplet = complet;
  for (const x of ch.slice(i + 1)) { x.html = '<p><br></p>'; delete x.htmlComplet; }
  if (suite && suite.suivant) suite.htmlComplet = '<p><br></p>';
  if (ch[0].suivant) refluerChaine(chaineDe(ch[0])); else { ch[0].html = complet; delete ch[0].htmlComplet; }
  redessinerCalque();
  apres();
}
// avant la suppression d'objets : on garde l'enchaînement cohérent
function avantSuppressionChaines(ids) {
  const tous = tousLesObjets();
  for (const id of ids) {
    const o = tous.get(id);
    if (!o || (!o.suivant && !o.precedent)) continue;
    const ch = chaineDe(o, tous);
    const complet = texteCompletChaine(ch);
    const prec = o.precedent && tous.get(o.precedent), suiv = o.suivant && tous.get(o.suivant);
    if (prec) { if (suiv) prec.suivant = suiv.id; else delete prec.suivant; }
    if (suiv) { if (prec) suiv.precedent = prec.id; else delete suiv.precedent; }
    const reste = ch.filter(x => x !== o);
    if (reste.length) {
      reste[0].htmlComplet = complet;
      if (reste.length === 1) { reste[0].html = complet; delete reste[0].htmlComplet; }
      else refluerChaine(reste);
    }
  }
}

/* ---------------- 3. pinceau (reproduire la mise en forme) ---------------- */
function prendrePinceau() {
  const s = selection();
  if (!s.length) return;
  const o = s[0];
  const P = { fond: o.fond, trait: o.trait, ombre: o.ombre, marges: o.marges, vertical: o.vertical };
  let e = null;
  if (E.edition) {
    const sel = window.getSelection();
    if (sel.rangeCount) { const n = sel.getRangeAt(0).startContainer; e = n.nodeType === 1 ? n : n.parentElement; }
  } else {
    const el = elementObjet(o.id);
    e = el && el.querySelector('.contenu span:not(.puce)');
  }
  if (e) {
    const cs = getComputedStyle(e);
    P.car = { police: cs.fontFamily.split(',')[0].replace(/["']/g, '').trim(), taille: Math.round(parseFloat(cs.fontSize) * 0.75 * 2) / 2, gras: +cs.fontWeight >= 600, italique: cs.fontStyle === 'italic', couleur: cs.color };
    const p = e.closest('p');
    if (p) P.par = { textAlign: p.style.textAlign, lineHeight: p.style.lineHeight, marginTop: p.style.marginTop, marginBottom: p.style.marginBottom };
  }
  E.pinceau = P;
  document.body.classList.add('mode-pinceau');

function finPinceau() { E.pinceau = null; document.body.classList.remove('mode-pinceau'); indicationModes(null); }
function appliquerPinceauObjet(o) {

    for (const k of ['fond', 'ombre']) { if (P[k]) o[k] = copie(P[k]); else delete o[k]; }
  }
  if (P.trait && o.type !== 'tableau') o.trait = copie(P.trait);
  if (o.type === 'texte' && P.marges) { o.marges = copie(P.marges); if (P.vertical) o.vertical = P.vertical; }
  redessinerObjet(o);
  E.sel = [o.id];
  if ((o.type === 'texte' || o.type === 'tableau') && P.car) {
    apres();
    E.histo.pop(); // une seule étape d'annulation pour tout

  } else apres();
}
function appliquerStyleCar(z, car, par, tout) {
  document.execCommand('fontName', false, car.police);

  document.execCommand('foreColor', false, car.couleur);
  if (car.gras !== document.queryCommandState('bold')) document.execCommand('bold');
  if (car.italique !== document.queryCommandState('italic')) document.execCommand('italic');

document.addEventListener('mouseup', () => {

      <div class="boite-pied"><button class="bouton" data-rr="suivant">Suivant</button><button class="bouton" data-rr="remplacer">Remplacer</button><button class="bouton principal" data-rr="tout">Remplacer tout</button></div>`;

  setTimeout(() => $('#rr-quoi').focus(), 0);
}
let posRecherche = null;
// liste des zones de texte du document, dans l'ordre
function zonesTexte() {
  const l = [];
  E.fiche.pages.forEach((p, ip) => p.items.forEach(o => {
    if (o.type === 'texte' && !o.precedent) l.push({ ip, o, cel: null });
    if (o.type === 'tableau') o.tableau.cellules.forEach((c, i) => l.push({ ip, o, cel: i }));
  }));
  return l;
}
function htmlZone(z) { return z.cel == null ? (z.o.suivant ? texteCompletChaine(chaineDe(z.o)) : z.o.html) : z.o.tableau.cellules[z.cel].html; }
function actionRecherche(action) {
  const quoi = $('#rr-quoi').value, par = $('#rr-par').value, casse = $('#rr-casse').checked;
  const etat = $('#rr-etat');
  if (!quoi) return;
  const norm = t => (casse ? t : t.toLowerCase());
  if (action === 'tout') {
    quitterEdition();
    avant();
    let n = 0;
    for (const z of zonesTexte()) {
      const d = document.createElement('div');
      d.innerHTML = htmlZone(z);
      const tw = document.createTreeWalker(d, NodeFilter.SHOW_TEXT);
      let modif = false;
      for (let t = tw.nextNode(); t; t = tw.nextNode()) {
        const re = new RegExp(quoi.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), casse ? 'g' : 'gi');
        const v = t.nodeValue.replace(re, () => { n++; modif = true; return par; });
        if (modif) t.nodeValue = v;
      }
      if (!modif) continue;
      if (z.cel != null) z.o.tableau.cellules[z.cel].html = d.innerHTML;
      else if (z.o.suivant) { const ch = chaineDe(z.o); ch[0].htmlComplet = d.innerHTML; refluerChaine(ch); }
      else z.o.html = d.innerHTML;
    }
    if (!n) { E.histo.pop(); etat.textContent = 'Aucune occurrence trouvée.'; return; }
    afficherPage();
    dessinerVignettes();
    apres();
    etat.textContent = `${n} remplacement(s) effectué(s).`;
    return;
  }
  if (action === 'remplacer' && E.edition) {
    const s = window.getSelection();
    if (s.rangeCount && norm(s.toString()) === norm(quoi)) document.execCommand('insertText', false, par);
  }
  // recherche de l'occurrence suivante, à partir de la position courante
  const zones = zonesTexte();
  const depart = posRecherche || { zone: -1, offset: 0 };
  for (let k = 0; k <= zones.length; k++) {
    const iz = (Math.max(depart.zone, 0) + k) % zones.length;
    const z = zones[iz];
    const d = document.createElement('div');
    d.innerHTML = z.cel == null ? z.o.html : z.o.tableau.cellules[z.cel].html;
    const texte = norm(d.textContent);
    const from = k === 0 && depart.zone === iz ? depart.offset : 0;
    const i = texte.indexOf(norm(quoi), from);
    if (i < 0) continue;
    posRecherche = { zone: iz, offset: i + quoi.length };
    montrerOccurrence(z, i, quoi.length);
    etat.textContent = `Trouvé page ${z.ip + 1}.`;
    return;
  }
  posRecherche = null;
  etat.textContent = 'Aucune autre occurrence.';
}
function montrerOccurrence(z, debut, long) {
  if (E.modeMaitre) quitterModeMaitre();
  if (E.ip !== z.ip) allerPage(z.ip);
  E.sel = [z.o.id];
  entrerEdition(z.o);
  const el = elementObjet(z.o.id);
  const zone = z.cel == null ? $('.contenu', el) : $(`td[data-cellule="${z.cel}"] .contenu`, el);
  if (!zone) return;
  const tw = document.createTreeWalker(zone, NodeFilter.SHOW_TEXT);
  let pos = 0, r = document.createRange(), ok = 0;
  for (let t = tw.nextNode(); t; t = tw.nextNode()) {
    const L = t.nodeValue.length;
    if (!ok && debut < pos + L) { r.setStart(t, debut - pos); ok = 1; }
    if (ok && debut + long <= pos + L) { r.setEnd(t, debut + long - pos); ok = 2; break; }
    pos += L;
  }
  if (ok === 2) {
    zone.focus({ preventScroll: true });
    const s = window.getSelection();
    s.removeAllRanges(); s.addRange(r);
    const b = r.getBoundingClientRect(), d = $('#defile'), rd = d.getBoundingClientRect();
    if (b.top < rd.top || b.bottom > rd.bottom) d.scrollTop += b.top - rd.top - rd.height / 2;
  }
}

    if (ex) { ex.replaceWith(...ex.childNodes); p.normalize(); }

    const tw = document.createTreeWalker(p, NodeFilter.SHOW_TEXT);
    let t = tw.nextNode();
    while (t && (!t.nodeValue.trim() || t.parentElement.closest('.puce'))) t = tw.nextNode();
    if (!t) return;

// positions (mm) des repères de grille et de ligne de base, pour l'affichage et le magnétisme
function reperesGrille() {
  const P = E.fiche.page, [mh, md, mb, mg] = P.marges;
  const v = [], h = [], base = [];
  if (P.grille) {
    const { cols, lignes, espace } = P.grille;
    const lw = (P.w - mg - md - espace * (cols - 1)) / cols, lh = (P.h - mh - mb - espace * (lignes - 1)) / lignes;
    for (let i = 0; i < cols; i++) { const x = mg + i * (lw + espace); v.push(x, x + lw); }
    for (let i = 0; i < lignes; i++) { const y = mh + i * (lh + espace); h.push(y, y + lh); }
  }
  if (P.lignesBase) {
    const pas = P.lignesBase.pas * 25.4 / 72, d = P.lignesBase.decalage * 25.4 / 72;
    for (let y = mh + d; y <= P.h - mb + 0.01; y += pas) base.push(y);
  }
  return { v, h, base };
}

const hexa = c => {
  if (!c) return null;
  c = String(c).trim().toLowerCase();
  const m = c.match(/^rgba?\((\d+),\s*(\d+),\s*(\d+)/);
  if (m) return '#' + [m[1], m[2], m[3]].map(x => (+x).toString(16).padStart(2, '0')).join('');
  return /^#[0-9a-f]{6}$/.test(c) ? c : null;
};
function appliquerJeuCouleurs(nouv) {
  quitterEdition();
  avant();
  const anc = (E.fiche.palette || []).map(hexa);
  const corresp = new Map();
  anc.forEach((c, i) => { if (c && nouv[i] && !corresp.has(c) && i > 0 && i < 7) corresp.set(c, nouv[i]); });
  const conv = c => { const h = hexa(c); return h && corresp.has(h) ? corresp.get(h) : c; };
  for (const p of [...E.fiche.pages, ...Object.values(E.fiche.maitres)]) for (const o of p.items) {
    if (o.fond) { o.fond.couleur = conv(o.fond.couleur); if (o.fond.degrade) o.fond.degrade = conv(o.fond.degrade); }
    if (o.trait) o.trait.couleur = conv(o.trait.couleur);
    if (o.wordart) { o.wordart.couleur = conv(o.wordart.couleur); if (o.wordart.degrade) o.wordart.degrade = conv(o.wordart.degrade); if (o.wordart.contour) o.wordart.contour.couleur = conv(o.wordart.contour.couleur); }
    if (o.tableau) for (const c of o.tableau.cellules) { if (c.fond) c.fond = conv(c.fond); if (c.bords) for (const k in c.bords) if (c.bords[k]) c.bords[k] = Object.assign({}, c.bords[k], { c: conv(c.bords[k].c) }); }
  }
  surToutLeHTML(d => { let m = false; d.querySelectorAll('[style*="color"]').forEach(s => { const n = conv(s.style.color); if (n !== s.style.color && hexa(n) !== hexa(s.style.color)) { s.style.color = n; m = true; } }); return m; });
  E.fiche.palette = [...nouv];
  afficherPage();
  dessinerVignettes();
  apres();
}
function appliquerJeuPolices(titres, corps) {
  quitterEdition();
  avant();
  const speciales = /wingdings|webdings|symbol/i;
  // styles de titre -> police des titres ; les autres -> police du corps
  const perso = E.fiche.styles || [];
  for (const s of STYLES_BASE) {
    const n = Object.assign({}, perso.find(p => p.nom === s.nom) || s, { police: /^Titre|Sous-titre/.test(s.nom) ? titres : corps });
    E.fiche.styles = (E.fiche.styles || []).filter(p => p.nom !== s.nom).concat([n]);
  }
  // texte du document : grand texte (14 pt et plus) = titres, le reste = corps
  surToutLeHTML(d => {
    let m = false;
    d.querySelectorAll('span').forEach(s => {
      if (s.classList.contains('puce') || speciales.test(s.style.fontFamily)) return;
      const st = s.closest('[data-style]');
      const t = parseFloat(s.style.fontSize) || 0;

  });

  afficherPage();
  dessinerVignettes();
  apres();
}

/* ---------------- images EMF / WMF ---------------- */
async function convertirMetafichiers() {
  const refs = Object.keys(E.fiche.images).filter(k => /^data:image\/x-(emf|wmf)/.test(E.fiche.images[k]));
  if (!refs.length || typeof LecteurMeta === 'undefined') return;
  let n = 0, illisibles = 0;
  for (const k of refs) {
    try { const png = await LecteurMeta.versPNG(E.fiche.images[k]); if (png) { E.fiche.images[k] = png; n++; } }
    catch (e) { illisibles++; }
  }
  if (n) { afficherPage(); dessinerVignettes(); }
  if (illisibles) bandeau(`${illisibles} image(s) au format EMF+ (dessin Office récent) n'ont pas pu être affichées : elles restent en cadre gris. Clic droit › Changer l'image pour les remplacer.`);
}
// profil des pixels opaques des images (habillage serré) : calculé une fois par image
const profilsEnCours = new Set();
function profilImage(ref) {
  if (!ref || Rendu.profilsImages[ref] || profilsEnCours.has(ref) || !E.fiche.images[ref] || !/^data:image\/(png|gif|webp)/.test(E.fiche.images[ref])) return;
  profilsEnCours.add(ref);
  const im = new Image();
  im.onload = () => {
    const n = 64, w = Math.min(256, im.naturalWidth || 1);
    const c = document.createElement('canvas');
    c.width = w; c.height = n;
    const g = c.getContext('2d');
    g.drawImage(im, 0, 0, w, n);
    const d = g.getImageData(0, 0, w, n).data;
    const lignes = [];
    for (let y = 0; y < n; y++) {
      let a = -1, b = -1;
      for (let x = 0; x < w; x++) if (d[(y * w + x) * 4 + 3] > 24) { if (a < 0) a = x; b = x; }
      lignes.push(a < 0 ? null : [a / w, (b + 1) / w]);
    }
    Rendu.profilsImages[ref] = lignes;
    profilsEnCours.delete(ref);
    rafraichirDependances();
  };
  im.src = E.fiche.images[ref];
}

/* ---------------- version à jour des fiches (dossier OneDrive partagé) ----------------
   L'outil partagé note sa version et son adresse ; une fiche enregistrée avec une
   version plus ancienne propose de passer à la nouvelle. */
const CLE_OUTIL = 'pagelibre-outil';
function lireOutil() { try { return JSON.parse(localStorage.getItem(CLE_OUTIL) || 'null'); } catch (e) { return null; } }
function noterOutil(estFiche) {
  if (estFiche) return;
  try {
    const o = lireOutil();
    if (!o || o.version <= VERSION_EDITEUR || o.url === location.href) localStorage.setItem(CLE_OUTIL, JSON.stringify({ version: VERSION_EDITEUR, url: location.href }));
  } catch (e) { /* stockage indisponible */ }
}
function proposerNouvelleVersion() {
  const o = lireOutil();
  if (!o || !(o.version > VERSION_EDITEUR) || o.url === location.href) return;
  const bd = $('#bandeau');
  bd.dataset.type = 'version';
  bd.innerHTML = `<span>Une version plus récente de l'PageLibre est disponible (${esc(o.version.slice(0, 10).split('-').reverse().join('/'))}).</span><button class="bouton principal" data-v>Ouvrir cette fiche avec la nouvelle version</button><button class="bouton" data-n>Plus tard</button>`;
  bd.hidden = false;
  $('[data-n]', bd).onclick = () => { bd.hidden = true; };
  $('[data-v]', bd).onclick = async () => {
    quitterEdition();
    try {
      await bdFaire('readwrite', s => s.put({ fiche: E.fiche, nom: decodeURIComponent(location.pathname.split('/').pop() || ''), modifie: E.modifie, date: Date.now() }, 'transfert'));
      E.modifie = false;
      location.href = o.url;
    } catch (e) { alerte('Impossible de passer à la nouvelle version : ' + e.message); }
  };
}
async function reprendreTransfert() {
  let t = null;
  try { t = await bdFaire('readonly', s => s.get('transfert')); } catch (e) { return false; }
  if (!t || !t.fiche || Date.now() - t.date > 10 * 60 * 1000) return false;
  try { await bdFaire('readwrite', s => s.delete('transfert')); } catch (e) { /* */ }
  chargerFiche(t.fiche, { nom: t.nom });
  E.modifie = true;
  majTitre();
  bandeau(`Fiche « ${t.nom || E.fiche.titre} » reprise avec la nouvelle version de l'outil. Enregistrez-la (Ctrl+S) à la place de l'ancienne pour qu'elle reste à jour.`);
  return true;
}

/* ---------------- fiches récentes ---------------- */
async function noterRecent(poignee) {
  if (!poignee || !poignee.name) return;
  try {
    const l = (await bdFaire('readonly', s => s.get('recents'))) || [];
    const reste = [];
    for (const r of l) { try { if (!(await r.poignee.isSameEntry(poignee))) reste.push(r); } catch (e) { /* */ } }
    reste.unshift({ poignee, nom: poignee.name, date: Date.now() });
    await bdFaire('readwrite', s => s.put(reste.slice(0, 10), 'recents'));
  } catch (e) { /* les poignées de fichiers ne sont pas mémorisables ici */ }
}
async function listeRecents() { try { return (await bdFaire('readonly', s => s.get('recents'))) || []; } catch (e) { return []; } }
async function ouvrirRecent(r) {
  try {
    const opts = { mode: /\.html?$/i.test(r.nom) ? 'readwrite' : 'read' };
    if ((await r.poignee.queryPermission(opts)) !== 'granted' && (await r.poignee.requestPermission(opts)) !== 'granted') return;
    const f = await r.poignee.getFile();
    ouvrirFichier(f, /\.html?$/i.test(f.name) ? r.poignee : null);
  } catch (e) { alerte(`Impossible de rouvrir « ${r.nom} » : le fichier a peut-être été déplacé ou supprimé.`); }
}

/* ---------------- pages préparées hors écran (impression, export) ---------------- */
async function preparerPages(indices, coupe) {
  const z = $('#impression');
  z.innerHTML = '';
  z.classList.add('mesure');
  z.classList.toggle('coupe', !!coupe);
  const P = E.fiche.page;
  for (const i of indices) {
    const f = Rendu.page(E.fiche.pages[i], E.fiche, { numero: i + 1 });
    if (!coupe) { z.appendChild(f); continue; }
    // planche : fond perdu de 3 mm et traits de coupe autour de la page
    const M = 10, FP = 3;
    const planche = document.createElement('div');
    planche.className = 'planche';
    planche.style.cssText = `position:relative;width:${P.w + 2 * M}mm;height:${P.h + 2 * M}mm;background:#fff`;
    const fp = document.createElement('div');
    fp.style.cssText = `position:absolute;left:${M - FP}mm;top:${M - FP}mm;width:${P.w + 2 * FP}mm;height:${P.h + 2 * FP}mm;overflow:hidden`;
    f.style.position = 'absolute';
    f.style.left = FP + 'mm'; f.style.top = FP + 'mm';
    fp.appendChild(f);
    planche.appendChild(fp);
    const trait = (x, y, w, h) => { const t = document.createElement('div'); t.style.cssText = `position:absolute;left:${x}mm;top:${y}mm;width:${w}mm;height:${h}mm;background:#000`; planche.appendChild(t); };
    const ep = 0.1, L = 5, ecart = FP + 1;
    for (const x of [M, M + P.w]) { trait(x - ep / 2, M - ecart - L, ep, L); trait(x - ep / 2, M + P.h + ecart, ep, L); }
    for (const y of [M, M + P.h]) { trait(M - ecart - L, y - ep / 2, L, ep); trait(M + P.w + ecart, y - ep / 2, L, ep); }
    z.appendChild(planche);
  }
  await Promise.all($$('img', z).map(i => (i.decode ? i.decode().catch(() => {}) : null)));
  Rendu.postMiseEnPage(z);
  return z;
}

/* ---------------- export des pages en images PNG ---------------- */
async function pageEnPNG(feuille, dpi) {
  const P = E.fiche.page;
  const W = P.w * 96 / 25.4, H = P.h * 96 / 25.4, k = dpi / 96;
  const css = ($('#css-rendu') || { textContent: '' }).textContent;
  const xhtml = new XMLSerializer().serializeToString(feuille);
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${Math.round(W * k)}" height="${Math.round(H * k)}">` +
    `<foreignObject x="0" y="0" width="${W}" height="${H}" transform="scale(${k})"><div xmlns="http://www.w3.org/1999/xhtml"><style><![CDATA[${css}]]></style>${xhtml}</div></foreignObject></svg>`;
  const img = new Image();
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  await img.decode();
  const c = document.createElement('canvas');
  c.width = Math.round(W * k); c.height = Math.round(H * k);
  const g = c.getContext('2d');
  g.fillStyle = P.fond || '#ffffff';
  g.fillRect(0, 0, c.width, c.height);
  g.drawImage(img, 0, 0);
  return new Promise(ok => c.toBlob(ok, 'image/png'));
}
async function exporterImages(toutes, dpi) {
  quitterEdition();
  const indices = toutes ? E.fiche.pages.map((p, i) => i) : [E.modeMaitre ? 0 : E.ip];
  const base = (E.fiche.titre || 'fiche').replace(/[\\/:*?"<>|]+/g, '_');
  let dossier = null;
  if (indices.length > 1 && window.showDirectoryPicker) {
    try { dossier = await showDirectoryPicker({ mode: 'readwrite' }); } catch (e) { if (e.name === 'AbortError') return; }
  }
  const z = await preparerPages(indices, false);
  const feuilles = $$(':scope > .feuille', z);
  try {
    for (let n = 0; n < feuilles.length; n++) {
      const blob = await pageEnPNG(feuilles[n], dpi);
      const nom = `${base} - page ${indices[n] + 1}.png`;
      if (dossier) {
        const fh = await dossier.getFileHandle(nom, { create: true });
        const w = await fh.createWritable(); await w.write(blob); await w.close();
      } else {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob); a.download = nom;
        document.body.appendChild(a); a.click();
        setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 3000);
      }
    }
    bandeau(`${feuilles.length} image(s) PNG exportée(s)${dossier ? ` dans « ${dossier.name} »` : ' (dossier Téléchargements)'}.`);
  } catch (e) {
    alerte('Export impossible : ' + e.message);
  } finally { libererPages(); }
}

/* ==== pwa.js ==== */
/* =====================================================================
   PageLibre : application installable (PWA)
   - service worker (fonctionne hors connexion, mise à jour proposée) ;
   - bouton « Installer l'application » ;
   - fichiers .pagelibre et .pub ouverts par double-clic une fois installée.
   Rien n'est actif quand la page est ouverte comme fichier local (file://).
   ===================================================================== */
const EN_LIGNE = /^https?:$/.test(location.protocol);

function initPWA() {
  // installation
  let invite = null;
  const bouton = $('#bouton-installer');
  window.addEventListener('beforeinstallprompt', ev => {
    ev.preventDefault();
    invite = ev;
    if (bouton) bouton.hidden = false;
  });
  if (bouton) bouton.onclick = async () => {
    if (!invite) return;
    invite.prompt();
    await invite.userChoice.catch(() => null);
    invite = null;
    bouton.hidden = true;
  };
  window.addEventListener('appinstalled', () => { if (bouton) bouton.hidden = true; });

  // fichiers ouverts depuis l'Explorateur (application installée)
  if ('launchQueue' in window) {
    window.launchQueue.setConsumer(async params => {
      const h = params.files && params.files[0];
      if (!h) return;
      try {
        const f = await h.getFile();
        noterRecent(h);
        ouvrirFichier(f, /\.(pagelibre|html?)$/i.test(f.name) ? h : null);
      } catch (e) { alerte('Impossible d\'ouvrir ce fichier.'); }
    });
  }

  // service worker
  if (!EN_LIGNE || !('serviceWorker' in navigator)) return;
  navigator.serviceWorker.register('sw.js').then(reg => {
    const proposer = w => {
      const bd = $('#bandeau');
      bd.dataset.type = 'maj';
      bd.innerHTML = '<span>Nouvelle version de PageLibre disponible.</span><button class="bouton principal" data-r>Recharger</button><button class="bouton" data-p>Plus tard</button>';
      bd.hidden = false;
      $('[data-p]', bd).onclick = () => { bd.hidden = true; };
      $('[data-r]', bd).onclick = () => {
        if (E.modifie) sauverBrouillon();
        w.postMessage('activer');
      };
    };
    if (reg.waiting && navigator.serviceWorker.controller) proposer(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const w = reg.installing;
      if (!w) return;
      w.addEventListener('statechange', () => {
        if (w.state === 'installed' && navigator.serviceWorker.controller) proposer(w);
      });
    });
    // vérifie les mises à jour toutes les heures si l'application reste ouverte
    setInterval(() => reg.update().catch(() => {}), 3600 * 1000);
  }).catch(e => console.warn('Service worker non enregistré', e));
  let recharge = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (recharge) return;
    recharge = true;
    location.reload();
  });
}
