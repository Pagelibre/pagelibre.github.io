<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PageLibre</title>
<meta name="description" content="PageLibre : logiciel libre et gratuit de mise en page (affiches, fiches, brochures), dans le navigateur. Ouvre aussi les anciens fichiers .pub.">
<meta name="theme-color" content="#23405e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style id="css-rendu">
/* ---- Rendu des pages (affichage, vignettes, impression) ---- */
.feuille {
  position: relative;
  background: #fff;
  overflow: hidden;
  color: #000;
  font-family: 'Times New Roman', serif;
  font-size: 10pt;
  line-height: normal;
}
.feuille .calque-maitre, .feuille .calque-objets { position: absolute; inset: 0; }
.feuille .calque-maitre { pointer-events: none; }
.objet {
  position: absolute;
  box-sizing: border-box;
  transform-origin: 50% 50%;
}
.objet > .svg-forme, .objet > .svg-wordart {
  position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible;
}
.objet.t-image > .clip { position: absolute; inset: 0; overflow: hidden; }
.objet.t-image > .clip > img { position: absolute; display: block; max-width: none; user-select: none; -webkit-user-drag: none; }
.objet.t-image > .clip.manquante {
  background: repeating-linear-gradient(45deg, #ececec 0 6px, #dcdcdc 6px 12px);
  display: flex; align-items: center; justify-content: center; color: #777; font: 9pt Segoe UI, sans-serif;
}
.cadre-texte {
  position: absolute; inset: 0; box-sizing: border-box;
  display: flex; flex-direction: column; justify-content: flex-start;
}
.cadre-texte.v-milieu { justify-content: center; }
.cadre-texte.v-bas { justify-content: flex-end; }
.cadre-texte.sens-haut-bas { writing-mode: vertical-rl; }
.cadre-texte.sens-bas-haut { writing-mode: vertical-rl; transform: rotate(180deg); }
.contenu {
  white-space: pre-wrap;
  overflow-wrap: break-word;
  tab-size: 12.7mm;
  outline: none;
  min-height: 1em;
}
.contenu p { margin: 0; }
.contenu .habillage { display: block; user-select: none; }
.contenu .hab-espace { display: inline-block; height: 1px; user-select: none; }
.contenu .tab { display: inline-block; white-space: pre; tab-size: 0; overflow: hidden; vertical-align: baseline; }
.contenu.cesure { hyphens: manual; -webkit-hyphens: manual; }
.objet > .biseau { position: absolute; inset: 0; pointer-events: none; }
.contenu.calage p { margin-top: 0 !important; margin-bottom: 0 !important; }
.contenu.calage p, .contenu.calage span { line-height: inherit !important; }
table.tab td.a-diagonale { position: relative; vertical-align: top; }
table.tab td.a-diagonale .diag-haut { margin-left: 45%; min-height: 1em; }
table.tab td.a-diagonale .diag-bas { position: absolute; left: 1mm; bottom: 1mm; right: 45%; min-height: 1em; }
.contenu .lettrine { float: left; line-height: .82; margin: .06em .08em 0 0; }
.contenu a { color: #0563c1; }
.cadre-texte.colonnes { justify-content: flex-start; overflow: hidden; }
.cadre-texte.colonnes > .contenu { min-height: 0; }
.contenu .puce { user-select: none; }
.contenu.sens-haut-bas { writing-mode: vertical-rl; }
.contenu.sens-bas-haut { writing-mode: vertical-rl; transform: rotate(180deg); }
.objet.t-tableau > table.tab {
  width: 100%; height: 100%;
  table-layout: fixed; border-collapse: collapse; border-spacing: 0;
}
table.tab td { vertical-align: top; overflow: hidden; box-sizing: border-box; }

</style>
<style>
/* ---- Interface de l'éditeur (PageLibre) ---- */
:root {
  --vert: #23405e;
  --vert-fonce: #182d43;
  --vert-clair: #e3ecf5;
  --vert-survol: #31577d;
  --ruban: #f3f3f3;
  --ruban-bord: #d5d5d5;
  --texte: #262626;
  --texte-doux: #5b5b5b;
  --survol: #e1e1e1;
  --appui: #c8c8c8;
  --actif: #d6e4f2;
  --espace: #c8c8c8;
  --selection: #7a7a7a;
  --poignee: #ffffff;
  --repere: #6b9bd1;
  --guide: #e6007e;
  --contexte: #9b4f96;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font: 12px 'Segoe UI', system-ui, sans-serif;
  color: var(--texte);
  background: var(--ruban);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
#app { display: grid; grid-template-rows: auto auto auto minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr); height: 100vh; overflow: hidden; }

/* barre de titre */
#barre-titre {
  background: var(--vert); color: #fff; height: 32px;
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
}
.acces-rapide { display: flex; align-items: center; gap: 2px; padding-left: 6px; }
.logo-app { width: 22px; height: 22px; display: inline-flex; margin-right: 8px; }
.logo-app svg { width: 22px; height: 22px; box-shadow: 0 0 0 1px rgba(255,255,255,.35); border-radius: 5px; }
.titre-droite { display: flex; align-items: center; gap: 10px; }
.bouton-installer { background: #f2b705; color: #1d2b3a; border: 0; padding: 3px 10px; border-radius: 3px; cursor: pointer; font-size: 11px; font-weight: 600; }
.bouton-installer:hover { background: #ffc928; }
.qa { background: none; border: 0; width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 2px; }
.qa:hover { background: var(--vert-survol); }
.qa svg { width: 16px; height: 16px; }
.qa:disabled { opacity: .45; cursor: default; background: none; }
#titre-doc { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 50vw; }
.titre-droite { justify-self: end; padding-right: 12px; font-size: 11px; opacity: .9; }

/* onglets */
#onglets { background: var(--vert); display: flex; align-items: flex-end; padding-left: 4px; height: 28px; }
.onglet {
  background: none; border: 0; color: #fff; padding: 5px 13px 6px; cursor: pointer; font-size: 12px;
  border: 1px solid transparent; border-bottom: 0; margin-right: 1px;
}
.onglet:hover { background: var(--vert-survol); }
.onglet.actif { background: var(--ruban); color: var(--vert); border-color: var(--ruban-bord); }
.onglet-fichier { background: var(--vert-fonce); }
.onglet-fichier:hover { background: #12243a; }
#onglets-contexte { display: flex; margin-left: 10px; }
#onglets-contexte .onglet { color: #fff; position: relative; }
#onglets-contexte .onglet::before {
  content: ''; position: absolute; left: 0; right: 0; top: -1px; height: 3px; background: #f0c25a;
}
#onglets-contexte .onglet.actif { color: #7a5b00; }

/* ruban */
#ruban {
  background: var(--ruban); border-bottom: 1px solid var(--ruban-bord);
  height: 96px; display: flex; align-items: stretch; padding: 3px 4px 0; overflow-x: auto; overflow-y: hidden;
}
.panneau { display: none; align-items: stretch; }
.panneau.actif { display: flex; }
.groupe {
  display: flex; flex-direction: column; padding: 0 6px; border-right: 1px solid var(--ruban-bord); position: relative;
}
.groupe-corps { flex: 1; display: flex; align-items: flex-start; gap: 2px; }
.groupe-nom { text-align: center; color: var(--texte-doux); font-size: 11px; padding: 1px 0 3px; white-space: nowrap; }
.col { display: flex; flex-direction: column; gap: 1px; }
.ligne { display: flex; align-items: center; gap: 1px; }
.btn {
  background: none; border: 1px solid transparent; cursor: pointer; display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 4px; height: 24px; white-space: nowrap; border-radius: 0;
}
.btn:hover:not(:disabled) { background: var(--survol); border-color: #c5c5c5; }
.btn:active:not(:disabled) { background: var(--appui); }
.btn.on { background: var(--actif); border-color: #a9c3dd; }
.btn:disabled { opacity: .4; cursor: default; }
.btn svg { width: 16px; height: 16px; flex: none; }
.btn.grand { flex-direction: column; height: 70px; min-width: 46px; padding: 3px 4px; justify-content: flex-start; gap: 2px; line-height: 1.15; text-align: center; white-space: normal; }
.btn.grand svg { width: 32px; height: 32px; }
.btn.grand .lib { max-width: 64px; }
.btn .fl { font-size: 8px; margin-left: 1px; }
.btn.grand .fl { margin: 0; }
.btn.lettre { width: 24px; justify-content: center; font: bold 13px 'Segoe UI', serif; padding: 0; }
.btn.lettre.i { font-style: italic; font-family: Georgia, serif; }
.btn.lettre.u { text-decoration: underline; font-weight: normal; }
.btn .barre-couleur { display: block; height: 4px; width: 16px; margin-top: -3px; }
.btn.couleur { flex-direction: column; gap: 0; padding-top: 1px; justify-content: center; }
select.champ, input.champ {
  height: 22px; border: 1px solid #c6c6c6; background: #fff; font: inherit; padding: 0 3px; border-radius: 0;
}
select.champ:focus, input.champ:focus { outline: 1px solid var(--vert); border-color: var(--vert); }
.champ-num { width: 62px; }
.etiq { color: var(--texte-doux); min-width: 58px; display: inline-block; }
.etiq svg { width: 14px; height: 14px; vertical-align: -3px; }

/* corps */
/* hauteur bornée : la zone de travail défile au lieu de pousser la barre d'état */
#corps { display: grid; grid-template-columns: 150px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); min-height: 0; overflow: hidden; }
#corps.sans-volet { grid-template-columns: 0 minmax(0, 1fr); }
#volet-pages { background: #fff; border-right: 1px solid var(--ruban-bord); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.volet-titre { padding: 6px 10px; font-size: 13px; color: var(--texte); border-bottom: 1px solid #eee; }
#liste-pages { overflow-y: auto; padding: 8px 6px 20px; flex: 1; }
.vignette { display: flex; gap: 4px; align-items: flex-start; margin-bottom: 10px; cursor: pointer; padding: 3px; border: 2px solid transparent; }
.vignette:hover { background: #f1f1f1; }
.vignette.active { border-color: var(--vert); background: var(--vert-clair); }
.vignette .num { width: 16px; text-align: right; color: var(--texte-doux); padding-top: 2px; }
.vignette .mini { position: relative; overflow: hidden; background: #fff; box-shadow: 0 0 0 1px #bdbdbd; pointer-events: none; }
.vignette .mini > .feuille { transform-origin: 0 0; position: absolute; left: 0; top: 0; }

#zone { position: relative; display: grid; grid-template-columns: 22px minmax(0, 1fr); grid-template-rows: 22px minmax(0, 1fr); min-height: 0; min-width: 0; overflow: hidden; background: var(--espace); }
#zone.sans-regles { grid-template-columns: 0 minmax(0, 1fr); grid-template-rows: 0 minmax(0, 1fr); }
#coin-regles { grid-row: 1; grid-column: 1; background: #e9e9e9; border-right: 1px solid #b9b9b9; border-bottom: 1px solid #b9b9b9; }
#regle-h { grid-row: 1; grid-column: 2; width: 100%; height: 22px; display: block; }
#regle-v { grid-row: 2; grid-column: 1; height: 100%; width: 22px; display: block; }
#defile { grid-row: 2; grid-column: 2; overflow: auto; position: relative; outline: none; min-height: 0; min-width: 0; }
#scene { position: relative; }
#feuille-hote { position: absolute; transform-origin: 0 0; }
#feuille-hote > .feuille { box-shadow: 0 1px 4px rgba(0,0,0,.35); overflow: visible; }
#feuille-hote > .feuille::after {
  /* repères de marge */
  content: ''; position: absolute; pointer-events: none; z-index: 0;
  left: var(--mg, 12.7mm); right: var(--md, 12.7mm); top: var(--mh, 12.7mm); bottom: var(--mb, 12.7mm);
  border: 1px dashed var(--repere); opacity: .8;
}
#app.sans-reperes #feuille-hote > .feuille::after { display: none; }
#feuille-hote .calque-objets { z-index: 1; }
#app.limites #feuille-hote .objet.t-texte:not(.edition)::before,
#app.limites #feuille-hote .objet.t-tableau td::after {
  content: ''; position: absolute; inset: 0; outline: 1px dotted rgba(0,0,0,.28); pointer-events: none;
}
#app.limites #feuille-hote .objet.t-tableau td { position: relative; }
#feuille-hote .objet { cursor: default; }
#feuille-hote .objet.edition .contenu { cursor: text; }
#feuille-hote .objet.edition { z-index: 5; }
#feuille-hote .objet.edition .contenu[contenteditable] { caret-color: #000; }
#feuille-hote .objet.deborde.choisi::after {
  content: 'A…'; position: absolute; right: -2px; bottom: -2px; transform: translate(100%, 100%);
  background: #fff; border: 1px solid #c00; color: #c00; font: bold 9px 'Segoe UI'; padding: 0 2px; pointer-events: none;
}
#feuille-hote td.cel-choisie { box-shadow: inset 0 0 0 999px rgba(30, 110, 200, .22); }
.mode-dessin #defile, .mode-dessin #feuille-hote .objet { cursor: crosshair !important; }

/* calque de sélection */
#calque-ui { position: absolute; left: 0; top: 0; width: 0; height: 0; pointer-events: none; z-index: 10; }
.cadre-sel { position: absolute; border: 1px solid var(--selection); transform-origin: 50% 50%; }
.cadre-sel.secondaire { border: 1px dashed #8a8a8a; }
.cadre-sel.edition { border: 1px dashed #5a5a5a; }
.cadre-sel.groupe { border: 1px dashed var(--selection); }
.poignee {
  position: absolute; width: 9px; height: 9px; margin: -5px 0 0 -5px; background: var(--poignee);
  border: 1px solid #5f5f5f; border-radius: 50%; pointer-events: auto; box-shadow: 0 0 1px #fff;
}
.poignee.p-nw, .poignee.p-se { cursor: nwse-resize; }
.poignee.p-ne, .poignee.p-sw { cursor: nesw-resize; }
.poignee.p-n, .poignee.p-s { cursor: ns-resize; border-radius: 2px; }
.poignee.p-e, .poignee.p-w { cursor: ew-resize; border-radius: 2px; }
.poignee.p-rot {
  width: 14px; height: 14px; margin: -7px 0 0 -7px; cursor: grab; background: #fff; border: 1px solid #5f5f5f;
  display: flex; align-items: center; justify-content: center;
}
.poignee.p-rot::after { content: '\21BB'; font-size: 10px; line-height: 1; color: #333; }
.poignee.p-a, .poignee.p-b { cursor: move; }
.bord-sel { position: absolute; pointer-events: auto; cursor: move; }
.bord-sel.bord-h { left: -6px; right: -6px; top: -7px; height: 6px; }
.bord-sel.bord-b { left: -6px; right: -6px; bottom: -7px; height: 6px; }
.bord-sel.bord-g { top: -6px; bottom: -6px; left: -7px; width: 6px; }
.bord-sel.bord-d { top: -6px; bottom: -6px; right: -7px; width: 6px; }
.tige-rot { position: absolute; width: 1px; background: var(--selection); }
.lasso { position: absolute; border: 1px solid #3c7fd0; background: rgba(60, 127, 208, .12); }
.guide-mag { position: absolute; background: var(--guide); }
.guide-mag.v { width: 1px; }
.guide-mag.h { height: 1px; }
.info-bulle-pos {
  position: absolute; background: #333; color: #fff; padding: 2px 5px; font-size: 11px; border-radius: 2px; white-space: nowrap;
}

/* guides de règle */
#calque-guides { position: absolute; left: 0; top: 0; width: 0; height: 0; z-index: 9; }
.guide-regle { position: absolute; pointer-events: auto; }
.guide-regle.v { width: 7px; margin-left: -3px; cursor: col-resize; background: linear-gradient(90deg, transparent 3px, #2ca02c 3px, #2ca02c 4px, transparent 4px); }
.guide-regle.h { height: 7px; margin-top: -3px; cursor: row-resize; background: linear-gradient(180deg, transparent 3px, #2ca02c 3px, #2ca02c 4px, transparent 4px); }
#regle-h, #regle-v { cursor: pointer; }
.repere-grille, .ligne-base { position: absolute; pointer-events: none; }
.repere-grille.v { border-left: 1px dashed #4b7bd1; }
.repere-grille.h { border-top: 1px dashed #4b7bd1; }
.ligne-base { border-top: 1px dotted rgba(214, 120, 40, .55); }
/* deux pages côte à côte */
#scene > .feuille-voisine { position: absolute; transform-origin: 0 0; cursor: pointer; }
#scene > .feuille-voisine > .feuille { box-shadow: 0 1px 4px rgba(0,0,0,.35); }
#scene > .feuille-voisine:hover > .feuille { outline: 2px solid #a9c3dd; }
/* rognage */
.calque-rognage { pointer-events: none; }
.fantome-rog { position: absolute; pointer-events: auto; cursor: move; opacity: .38; outline: 1px dashed #333; }
.fantome-rog img { width: 100%; height: 100%; display: block; }
.fenetre-rog { position: absolute; inset: 0; pointer-events: auto; cursor: move; outline: 1px solid #222; }
.poignee-rog { position: absolute; background: #111; pointer-events: auto; border: 1px solid #fff; }
.poignee-rog.r-nw, .poignee-rog.r-ne, .poignee-rog.r-se, .poignee-rog.r-sw { width: 12px; height: 12px; margin: -6px 0 0 -6px; }
.poignee-rog.r-n, .poignee-rog.r-s { width: 16px; height: 6px; margin: -3px 0 0 -8px; cursor: ns-resize; }
.poignee-rog.r-e, .poignee-rog.r-w { width: 6px; height: 16px; margin: -8px 0 0 -3px; cursor: ew-resize; }
.poignee-rog.r-nw, .poignee-rog.r-se { cursor: nwse-resize; }
.poignee-rog.r-ne, .poignee-rog.r-sw { cursor: nesw-resize; }
/* séparateurs de tableau */
.calque-separateurs { pointer-events: none; }
.sep-tab { position: absolute; pointer-events: auto; }
.sep-col { top: 0; bottom: 0; width: 7px; cursor: col-resize; }
.sep-lig { left: 0; right: 0; height: 7px; cursor: row-resize; }
.sep-tab:hover { background: rgba(43, 87, 154, .35); }
/* modes */
.mode-pinceau #defile, .mode-pinceau #feuille-hote .objet, .mode-pinceau #feuille-hote .contenu { cursor: copy !important; }
.mode-lien #defile, .mode-lien #feuille-hote .objet, .mode-lien #feuille-hote .contenu { cursor: alias !important; }
/* cadres chaînés : petites flèches habituelles en PAO */
#app #feuille-hote .objet.a-suite.choisi:not(.x)::before, #app #feuille-hote .objet.est-suite.choisi:not(.x)::before {
  content: '\2192'; position: absolute; left: auto; top: auto; right: -4px; bottom: -4px; transform: translate(100%, 0); background: #fff; border: 1px solid #2b579a;
  outline: none; color: #2b579a; font: bold 10px 'Segoe UI'; padding: 0 3px; pointer-events: none; z-index: 2;
}
#app #feuille-hote .objet.est-suite.choisi:not(.x):not(.a-suite)::before { content: '\2190'; right: auto; bottom: auto; left: -4px; top: -4px; transform: translate(-100%, 0); }
#feuille-hote .champ-page { background: rgba(0, 0, 0, .06); }
/* panneau Rechercher */
#panneau-recherche {
  position: fixed; right: 24px; top: 170px; z-index: 75; width: 300px; background: #fff; border: 1px solid #9a9a9a; box-shadow: 0 6px 20px rgba(0,0,0,.25);
}
#panneau-recherche[hidden] { display: none; }
#panneau-recherche .boite-corps input[type=text] { width: 100%; }
#panneau-recherche.sans-remplacer label:nth-of-type(2), #panneau-recherche.sans-remplacer #rr-par,
#panneau-recherche.sans-remplacer [data-rr="remplacer"], #panneau-recherche.sans-remplacer [data-rr="tout"] { display: none; }

/* barre d'état */
#etat {
  height: 24px; background: #f0f0f0; border-top: 1px solid var(--ruban-bord); display: flex; justify-content: space-between;
  align-items: center; padding: 0 8px; color: var(--texte-doux); font-size: 11px;
}
.etat-gauche, .etat-droite { display: flex; align-items: center; gap: 10px; }
.etat-sep { width: 1px; height: 14px; background: #ccc; }
.etat-btn { background: none; border: 0; cursor: pointer; padding: 1px 5px; color: var(--texte-doux); display: inline-flex; align-items: center; }
.etat-btn:hover { background: var(--survol); }
.etat-btn svg { width: 14px; height: 14px; }
#curseur-zoom { width: 110px; accent-color: var(--vert); }
#etat-zoom { min-width: 44px; justify-content: flex-end; }

/* menus déroulants */
.menu {
  position: fixed; z-index: 100; background: #fff; border: 1px solid #c6c6c6; box-shadow: 2px 3px 8px rgba(0,0,0,.18);
  padding: 2px 0; min-width: 170px; max-height: 80vh; overflow-y: auto;
}
.menu-item { display: flex; align-items: center; gap: 8px; padding: 4px 18px 4px 8px; cursor: pointer; white-space: nowrap; background: none; border: 0; width: 100%; text-align: left; }
.menu-item:hover, .menu-item:focus { background: var(--actif); outline: none; }
.menu-item.desactive { opacity: .45; pointer-events: none; }
.menu-item .ic { width: 18px; display: inline-flex; justify-content: center; }
.menu-item .ic svg { width: 16px; height: 16px; }
.menu-item .raccourci { margin-left: auto; padding-left: 20px; color: #888; }
.menu-sep { height: 1px; background: #e2e2e2; margin: 3px 0; }
.menu-titre { padding: 5px 8px 3px; font-weight: 600; color: #444; background: #f2f2f2; }
.grille-couleurs { display: grid; grid-template-columns: repeat(10, 18px); gap: 3px; padding: 6px 8px; }
.grille-couleurs button { width: 18px; height: 18px; border: 1px solid #c8c8c8; padding: 0; cursor: pointer; }
.grille-couleurs button:hover { outline: 2px solid #e7a33b; outline-offset: -1px; }
.grille-formes { display: grid; grid-template-columns: repeat(6, 30px); gap: 2px; padding: 6px 8px; }

<script>
const VERSION_EDITEUR = '2026-11-20T21:50';
const DEPOT_URL = "https://github.com/Pagelibre/pagelibre.github.io";
const LIEN_SOUTIEN = "";
const LOGO_SVG = "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 64 64\">\n  <rect width=\"64\" height=\"64\" rx=\"14\" fill=\"#23405e\"/>\n  <path d=\"M18 10h20l11 11v31a3 3 0 0 1-3 3H18a3 3 0 0 1-3-3V13a3 3 0 0 1 3-3z\" fill=\"#ffffff\"/>\n  <path d=\"M38 10v8a3 3 0 0 0 3 3h8z\" fill=\"#c9d8e8\"/>\n  <rect x=\"20\" y=\"25\" width=\"12\" height=\"10\" rx=\"1.5\" fill=\"#f2b705\"/>\n  <path d=\"M35.5 27h8.5M35.5 32h8.5M20.5 40h23.5M20.5 45h23.5M20.5 50h15\" stroke=\"#23405e\" stroke-width=\"2.4\" stroke-linecap=\"round\"/>\n</svg>";
/* ==== lecteur_pub.js ==== */
/* =====================================================================
   Lecteur de fichiers .pub (format des versions 2003 à 2019)
   Transforme un .pub en « fiche » (modèle JSON de l'éditeur).
   Format décodé par analyse de fichiers d'essai (nov. 2026), pour l'interopérabilité :
   - conteneur OLE (CFB) : flux Contents (mise en page), Quill (texte),
     Escher (formes et images) ;
   - unités : EMU (360 000 par cm) ; le modèle de l'éditeur est en mm.
   ===================================================================== */
(function (racine) {
  'use strict';

  const FIN = 0xFFFFFFFA;
  const EMU_MM = 36000;
  const EMU_PT = 12700;

  /* ---------------------------------------------------------------
     1. Conteneur OLE (Compound File Binary)
     --------------------------------------------------------------- */
  function lireCFB(entree) {
    const u8 = entree instanceof Uint8Array ? entree : new Uint8Array(entree);
    const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
    const sig = [0xD0, 0xCF, 0x11, 0xE0, 0xA1, 0xB1, 0x1A, 0xE1];
    for (let i = 0; i < 8; i++) {
      if (u8[i] !== sig[i]) throw new Error("Ce fichier n'est pas un fichier .pub lisible.");
    }
    const ss = 1 << dv.getUint16(30, true);
    const mss = 1 << dv.getUint16(32, true);
    const nfat = dv.getUint32(44, true);
    const debutRep = dv.getUint32(48, true);
    const seuil = dv.getUint32(56, true);
    const debutMiniFat = dv.getUint32(60, true);
    let sDifat = dv.getUint32(68, true);
    const nDifat = dv.getUint32(72, true);
    const posSecteur = n => (n + 1) * ss;

    let difat = [];
    for (let i = 0; i < 109; i++) difat.push(dv.getUint32(76 + i * 4, true));
    for (let k = 0; k < nDifat && sDifat < FIN; k++) {
      const o = posSecteur(sDifat), par = ss / 4;
      for (let i = 0; i < par - 1; i++) difat.push(dv.getUint32(o + i * 4, true));
      sDifat = dv.getUint32(o + (par - 1) * 4, true);
    }
    difat = difat.filter(x => x < FIN).slice(0, nfat);
    const fat = new Uint32Array(difat.length * ss / 4);
    let fi = 0;
    for (const s of difat) {
      const o = posSecteur(s);
      for (let i = 0; i < ss / 4; i++) fat[fi++] = o + i * 4 + 4 <= u8.length ? dv.getUint32(o + i * 4, true) : 0xFFFFFFFE;
    }
    function chaine(debut, taille) {
      const liste = [];
      let n = debut, garde = 0;
      while (n < FIN && garde++ <= fat.length) { liste.push(n); n = fat[n]; }
      const out = new Uint8Array(liste.length * ss);
      liste.forEach((s, i) => {
        const o = posSecteur(s);
        out.set(u8.subarray(o, Math.min(o + ss, u8.length)), i * ss);
      });
      return taille != null ? out.subarray(0, Math.min(taille, out.length)) : out;
    }
    let minifat = new Uint32Array(0);
    if (debutMiniFat < FIN) {
      const b = chaine(debutMiniFat);
      minifat = new Uint32Array(b.buffer.slice(b.byteOffset, b.byteOffset + (b.length & ~3)));
    }
    const rep = chaine(debutRep);
    const rdv = new DataView(rep.buffer, rep.byteOffset, rep.byteLength);
    const entrees = [];
    for (let i = 0; i * 128 + 128 <= rep.length; i++) {
      const o = i * 128;
      const nl = rdv.getUint16(o + 64, true);
      let nom = '';
      for (let k = 0; k + 1 < nl - 1 && k < 64; k += 2) nom += String.fromCharCode(rdv.getUint16(o + k, true));
      entrees.push({
        nom, type: rep[o + 66],
        g: rdv.getUint32(o + 68, true), d: rdv.getUint32(o + 72, true), enfant: rdv.getUint32(o + 76, true),
        debut: rdv.getUint32(o + 116, true), taille: rdv.getUint32(o + 120, true)
      });
    }
    const racineE = entrees[0];
    const miniFlux = racineE && racineE.debut < FIN ? chaine(racineE.debut, racineE.taille) : new Uint8Array(0);
    function miniChaine(debut, taille) {
      const out = new Uint8Array(taille);
      let n = debut, pos = 0, garde = 0;
      while (n < FIN && pos < taille && garde++ <= minifat.length) {
        const o = n * mss;
        const morceau = miniFlux.subarray(o, o + Math.min(mss, taille - pos));
        out.set(morceau, pos); pos += morceau.length;
        n = minifat[n];
      }
      return out;
    }
    const chemins = new Map();
    const vus = new Set();
    (function parcourir(i, prefixe) {
      if (i >= FIN || i >= entrees.length || vus.has(i)) return;
      vus.add(i);
      const e = entrees[i];
      parcourir(e.g, prefixe);
      const p = prefixe + e.nom;
      chemins.set(p, e);
      if (e.type === 1) parcourir(e.enfant, p + '/');
      parcourir(e.d, prefixe);
    })(racineE ? racineE.enfant : FIN, '');

    return {
      chemins: [...chemins.keys()],
      lire(chemin) {
        const e = chemins.get(chemin);
        if (!e || e.type !== 2) return null;
        return e.taille < seuil ? miniChaine(e.debut, e.taille) : chaine(e.debut, e.taille);
      }
    };
  }

  /* ---------------------------------------------------------------
     2. Blocs « Contents » / styles Quill (id, type, données)
     --------------------------------------------------------------- */
  const FIXE = {
    0x78: 0, 0x05: 0, 0x08: 0, 0x0a: 0, 0x10: 2, 0x12: 2, 0x18: 2, 0x1a: 2, 0x07: 2,
    0x20: 4, 0x22: 4, 0x58: 4, 0x68: 4, 0x70: 4, 0xb8: 4, 0x28: 8, 0x38: 16, 0x48: 24
  };

  function vue(u8) { return new DataView(u8.buffer, u8.byteOffset, u8.byteLength); }

  function bloc(dv, o, fin) {
    if (o + 2 > fin) return null;
    const id = dv.getUint8(o), type = dv.getUint8(o + 1);
    if (type in FIXE) {
      const n = FIXE[type];
      if (o + 2 + n > fin) return null;
      let val = null;
      if (n === 2) val = dv.getUint16(o + 2, true);
      else if (n === 4) val = dv.getUint32(o + 2, true);
      return { id, type, off: o + 2, fin: o + 2 + n, val, varia: false };
    }
    if (!(type & 0x80) || o + 6 > fin) return null;
    const len = dv.getUint32(o + 2, true);
    if (len < 4 || o + 2 + len > fin) return null;
    return { id, type, off: o + 2, fin: o + 2 + len, val: null, varia: true };
  }

  function sousBlocs(dv, b) {
    const out = [];
    let o = b.off + 4;
    while (o < b.fin - 1) {
      const s = bloc(dv, o, b.fin);
      if (!s || s.fin <= o) break;
      out.push(s);
      o = s.fin;
    }
    return out;
  }

  function carte(liste) {
    const m = new Map();
    for (const b of liste) if (!m.has(b.id)) m.set(b.id, b);
    return m;
  }

  function blocsA(dv, off) {
    const len = dv.getUint32(off, true);
    return sousBlocs(dv, { off, fin: Math.min(off + len, dv.byteLength) });
  }

  const s32 = v => (v == null ? 0 : v | 0);

  function chaineBloc(dv, b) {
    let s = '';
    for (let o = b.off + 4; o + 1 < b.fin; o += 2) {
      const c = dv.getUint16(o, true);
      if (!c) break;
      s += String.fromCharCode(c);
    }
    return s;
  }

  /* ---------------------------------------------------------------
     3. Flux Contents : répertoire des « chunks »
     --------------------------------------------------------------- */
  function lireRepertoire(dv) {
    const t = dv.getUint32(0x1a, true);
    const chunks = [];
    let o = t + 4;
    const fin = dv.byteLength;
    for (let k = 0; k < 8 && o < fin - 1; k++) {
      const b = bloc(dv, o, fin);
      if (!b) break;
      if (b.type === 0x90) {
        let p = b.off + 4;
        while (p < b.fin - 1) {
          const e = bloc(dv, p, b.fin);
          if (!e) break;
          const ref = { seq: chunks.length, type: null, off: null, parent: null };
          if (e.type === 0x88) {
            for (const s of sousBlocs(dv, e)) {
              if (s.id === 2) ref.type = s.val;
              else if (s.id === 4) ref.off = s.val;
              else if (s.id === 5) ref.parent = s.val;
            }
          }
          chunks.push(ref);
          p = e.fin;
        }
      }
      o = b.fin;
    }
    return chunks;
  }

  /* ---------------------------------------------------------------
     4. Escher : formes, ancres, propriétés, images
     --------------------------------------------------------------- */
  function enregistrements(dv, debut, fin) {
    const out = [];
    let i = debut;
    while (i + 8 <= fin) {
      const vi = dv.getUint16(i, true), type = dv.getUint16(i + 2, true), len = dv.getUint32(i + 4, true);
      if (i + 8 + len > fin) break;
      out.push({ ver: vi & 0xF, inst: vi >> 4, type, off: i + 8, len });
      i += 8 + len;
    }
    return out;
  }

  function lireFOPT(u8, dv, r, props) {
    let complexe = r.off + r.inst * 6;
    for (let i = 0; i < r.inst; i++) {
      const pid = dv.getUint16(r.off + i * 6, true);
      const val = dv.getUint32(r.off + i * 6 + 2, true);
      const id = pid & 0x3fff;
      const p = { val };
      if (pid & 0x8000) {
        p.data = u8.subarray(complexe, Math.min(complexe + val, r.off + r.len));
        complexe += val;
      }
      if (!(id in props)) props[id] = p;
    }
  }

  function lireKV(dv, off, len) {
    if (len < 4) return null;
    const n = dv.getUint32(off, true);
    if (n !== len) return null;
    const m = {};
    for (let o = 4; o + 6 <= n; o += 6) m[dv.getUint16(off + o, true)] = dv.getUint32(off + o + 2, true);
    return m;
  }

  function lireEscher(stm, delay, pageW, pageH) {
    const dv = vue(stm);
    const formes = new Map();       // seq Contents -> forme Escher
    const tableaux = new Map();     // seq tableau -> {fond, cellules, bords}
    const blips = [];

    // BStore (catalogue des images)
    for (const r of enregistrements(dv, 0, dv.byteLength)) {
      if (r.type !== 0xF000) continue;
      for (const r2 of enregistrements(dv, r.off, r.off + r.len)) {
        if (r2.type !== 0xF001) continue;
        for (const f of enregistrements(dv, r2.off, r2.off + r2.len)) {
          if (f.type !== 0xF007) continue;
          blips.push({ btWin: stm[f.off], taille: dv.getUint32(f.off + 20, true), off: dv.getUint32(f.off + 28, true) });
        }
      }
      break;
    }

    function lireForme(r) {
      const f = { props: {}, rect: null };
      for (const s of enregistrements(dv, r.off, r.off + r.len)) {
        if (s.type === 0xF00A) { f.spid = dv.getUint32(s.off, true); f.flags = dv.getUint32(s.off + 4, true); f.stype = s.inst; }
        else if (s.type === 0xF00B || s.type === 0xF122) lireFOPT(stm, dv, s, f.props);
        else if (s.type === 0xF009) f.groupe = [0, 4, 8, 12].map(k => dv.getInt32(s.off + k, true));
        else if (s.type === 0xF00F) f.enfant = [0, 4, 8, 12].map(k => dv.getInt32(s.off + k, true));
        else if (s.type === 0xF010) {
          const kv = lireKV(dv, s.off, s.len);
          if (kv) f.ancre = kv;
          else if (s.len >= 16) f.ancreRect = [0, 4, 8, 12].map(k => dv.getInt32(s.off + k, true));
        }
        else if (s.type === 0xF011) { const kv = lireKV(dv, s.off, s.len); if (kv) f.seq = kv[0x6801]; }
      }
      return f;
    }

    // transfo : coordonnées du repère courant -> EMU page (origine en haut à gauche)
    function rectPage(f, transfo) {
      let r = null;
      if (f.enfant && transfo) {
        const [x1, y1, x2, y2] = f.enfant;
        r = { x: transfo.ax + (x1 - transfo.gx) * transfo.sx, y: transfo.ay + (y1 - transfo.gy) * transfo.sy,
              w: (x2 - x1) * transfo.sx, h: (y2 - y1) * transfo.sy };
      } else if (f.ancre && (0x2001 in f.ancre)) {
        const a = f.ancre;
        const x1 = s32(a[0x2001]), y1 = s32(a[0x2002]), x2 = s32(a[0x2003]), y2 = s32(a[0x2004]);
        r = { x: x1 + pageW / 2, y: y1 + pageH / 2, w: x2 - x1, h: y2 - y1 };
      } else if (f.ancreRect) {
        const [x1, y1, x2, y2] = f.ancreRect;
        r = { x: x1, y: y1, w: x2 - x1, h: y2 - y1 };
      }
      return r;
    }

    let ordreZ = 0; // ordre d'apparition dans Escher = ordre de superposition
    function parcourirGroupe(r, transfo) {
      const enfants = enregistrements(dv, r.off, r.off + r.len);
      let transfoEnfants = transfo;
      enfants.forEach((e, i) => {
        if (e.type === 0xF004) {
          const f = lireForme(e);
          const estGroupe = i === 0 && !!f.groupe;
          // la forme du groupe se place dans le repère du parent, les enfants dans celui du groupe
          f.rect = rectPage(f, estGroupe ? transfo : transfoEnfants);
          f.ordre = ++ordreZ;
          if (estGroupe) {
            // forme du groupe lui-même : définit le repère des enfants
            const g = f.groupe;
            const gw = g[2] - g[0], gh = g[3] - g[1];
            if (f.rect && gw && gh) {
              transfoEnfants = { ax: f.rect.x, ay: f.rect.y, gx: g[0], gy: g[1], sx: f.rect.w / gw, sy: f.rect.h / gh };
            } else {
              transfoEnfants = null; // groupe racine : les enfants ont une ancre propre
            }
          }
          if (f.ancre && (0x6802 in f.ancre)) {
            const a = f.ancre, t = a[0x6802];
            if (!tableaux.has(t)) tableaux.set(t, { fond: null, cellules: new Map(), bords: [] });
            const T = tableaux.get(t);
            if (0x2001 in a) {
              T.bords.push({ sens: a[0x2001], r1: a[0x2004] || 0, c1: a[0x2005] || 0, r2: a[0x2006] || 0, c2: a[0x2007] || 0, props: f.props });
            } else T.cellules.set(a[0x2003] || 0, f.props);
          } else if (f.seq != null) {
            formes.set(f.seq, f);
          }
        } else if (e.type === 0xF003) {
          parcourirGroupe(e, transfoEnfants);
        }
      });
    }

    for (const r of enregistrements(dv, 0, dv.byteLength)) void r; // (validation)
    // Les DgContainer sont séparés par des octets de remplissage : on les cherche.
    for (let o = 0; o + 8 <= stm.length; o++) {
      if (stm[o] === 0x0f && stm[o + 1] === 0x00 && stm[o + 2] === 0x02 && stm[o + 3] === 0xf0) {
        const len = dv.getUint32(o + 4, true);
        if (o + 8 + len > stm.length) continue;
        for (const r of enregistrements(dv, o + 8, o + 8 + len)) {
          if (r.type === 0xF003) parcourirGroupe(r, null);
        }
        o += 7 + len;
      }
    }

    // Images
    const ddv = delay ? vue(delay) : null;
    function image(pib) {
      const b = blips[pib - 1];
      if (!b || !ddv || b.off + 8 > delay.length) return null;
      const inst = ddv.getUint16(b.off, true) >> 4, type = ddv.getUint16(b.off + 2, true), len = ddv.getUint32(b.off + 4, true);
      const deb = b.off + 8, fin = Math.min(deb + len, delay.length);
      const deuxUID = inst & 1;
      const types = { 0xF01D: 'image/jpeg', 0xF01E: 'image/png', 0xF01F: 'image/bmp', 0xF029: 'image/tiff', 0xF01A: 'emf', 0xF01B: 'wmf', 0xF01C: 'pict' };
      const mime = types[type];
      if (!mime) return null;
      if (mime === 'emf' || mime === 'wmf' || mime === 'pict') {
        const h = deb + 16 * (deuxUID ? 2 : 1);
        return { mime, compresse: delay[h + 32] === 0, data: delay.subarray(h + 34, fin), taille: ddv.getUint32(h, true) };
      }
      const d = deb + 16 * (deuxUID ? 2 : 1) + 1;
      let data = delay.subarray(d, fin);
      if (mime === 'image/bmp') {
        // DIB -> BMP : ajouter l'en-tête de fichier
        const dib = vue(data);
        const hs = dib.getUint32(0, true), bits = dib.getUint16(14, true), clr = dib.getUint32(32, true);
        const pal = bits <= 8 ? (clr || (1 << bits)) * 4 : (dib.getUint32(16, true) === 3 ? 12 : 0);
        const bmp = new Uint8Array(14 + data.length);
        const bv = vue(bmp);
        bmp[0] = 0x42; bmp[1] = 0x4D;
        bv.setUint32(2, bmp.length, true); bv.setUint32(10, 14 + hs + pal, true);
        bmp.set(data, 14);
        data = bmp;
      }
      return { mime, data };
    }

    return { formes, tableaux, image, nbImages: blips.length };
  }

  /* ---------------------------------------------------------------
     5. Quill : texte, histoires, styles, polices, couleurs
     --------------------------------------------------------------- */
  function lireQuill(q) {
    const dv = vue(q);
    const index = [];
    let L = 0x18, garde = 0;
    while (L && L + 8 <= q.length && garde++ < 64) {
      const n = dv.getUint16(L + 2, true), suivant = dv.getUint32(L + 4, true);
      for (let i = 0; i < n; i++) {
        const o = L + 8 + 24 * i;
        if (o + 24 > q.length) break;
        index.push({
          nom: String.fromCharCode(q[o + 2], q[o + 3], q[o + 4], q[o + 5]),
          id: dv.getUint16(o + 6, true), off: dv.getUint32(o + 16, true), len: dv.getUint32(o + 20, true)
        });
      }
      L = suivant !== 0xffffffff && suivant > L ? suivant : 0;
    }
    const tous = nom => index.filter(e => e.nom === nom);
    const un = nom => tous(nom)[0];

    const T = un('TEXT');
    let texte = '';
    if (T) for (let o = T.off; o + 1 < T.off + T.len; o += 2) texte += String.fromCharCode(dv.getUint16(o, true));
    const baseTexte = T ? T.off : 0;

    // histoires : identifiants (SYID) et longueurs (STRS)
    const histoires = new Map();
    const S = un('SYID'), R = un('STRS');
    if (S && R) {
      const n = dv.getUint32(S.off + 4, true);
      const m = dv.getUint32(R.off, true);
      let pos = 0;
      for (let i = 0; i < Math.min(n, m); i++) {
        const id = dv.getUint32(S.off + 8 + i * 4, true);
        const len = dv.getUint32(R.off + 12 + i * 4, true);
        histoires.set(id, { index: i, debut: pos, fin: pos + len });
        pos += len;
      }
    } else if (texte) histoires.set(0, { index: 0, debut: 0, fin: texte.length });

    // cellules de tableau : TCD (id = index de l'histoire)
    const cellulesTexte = new Map();
    for (const e of tous('TCD ')) {
      const n = dv.getUint32(e.off, true);
      const fins = [];
      for (let i = 0; i <= n && e.off + 12 + i * 4 + 4 <= e.off + e.len; i++) fins.push(dv.getUint32(e.off + 12 + i * 4, true));
      cellulesTexte.set(e.id, fins);
    }

    // polices
    const polices = [];
    const F = un('FONT');
    if (F) {
      const n = dv.getUint32(F.off + 4, true);
      for (let i = 0; i < n; i++) {
        const o = F.off + 20 + dv.getUint32(F.off + 20 + i * 4, true);
        if (o + 2 > F.off + F.len) { polices.push('Times New Roman'); continue; }
        const nc = dv.getUint16(o, true);
        let s = '';
        for (let k = 0; k < nc; k++) s += String.fromCharCode(dv.getUint16(o + 2 + k * 2, true));
        polices.push(s);
      }
    }

    // couleurs du texte (PL)
    const couleursTexte = [];
    const P = un('PL  ');
    if (P) {
      const n = dv.getUint32(P.off, true);
      let o = P.off + 12;
      for (let i = 0; i < n && o + 4 <= P.off + P.len; i++) {
        const len = dv.getUint32(o, true);
        let c = 0;
        for (const b of sousBlocs(dv, { off: o, fin: o + len })) if (b.id === 1) { c = b.val; break; }
        couleursTexte.push(c);
        o += len;
      }
    }

    // pages de propriétés FDPC (caractères) et FDPP (paragraphes)
    function pagesProps(nom) {
      const runs = [];
      for (const e of tous(nom).sort((a, b) => a.id - b.id)) {
        const n = dv.getUint16(e.off, true);
        for (let i = 0; i < n; i++) {
          const fin = (dv.getUint32(e.off + 8 + i * 4, true) - baseTexte) / 2;
          const so = dv.getUint16(e.off + 8 + n * 4 + i * 2, true);
          const blocs = so ? blocsA(dv, e.off + so) : [];
          runs.push({ fin, blocs });
        }
      }
      runs.sort((a, b) => a.fin - b.fin);
      return runs;
    }
    const runsCar = pagesProps('FDPC');
    const runsPar = pagesProps('FDPP');

    // style par défaut (STSH 1 : premier style de la feuille)
    let defCar = [], defPar = [];
    const st = tous('STSH').find(e => e.id === 1);
    if (st) {
      try {
        // u32 len, u32 nb, ... puis styles : on prend le premier style de caractères trouvé
        const nb = dv.getUint32(st.off + 4, true);
        const deb = st.off + 8 + nb * 4 + 12;
        void deb;
        // recherche simple : premier bloc 0x0c (taille) suivi d'une table de polices
        for (let o = st.off + 8; o < st.off + st.len - 6; o++) {
          if (q[o] === 0x0c && q[o + 1] === 0x22) {
            // remonte au début du style (u32 longueur)
            for (let d = o - 4; d >= st.off; d--) {
              const l = dv.getUint32(d, true);
              if (l >= 6 && d + l <= st.off + st.len && d + 4 === o) { defCar = blocsA(dv, d); break; }
            }
            break;
          }
        }
      } catch (e) { /* style par défaut facultatif */ }
    }

    return { texte, histoires, cellulesTexte, polices, couleursTexte, runsCar, runsPar, defCar, defPar, dv };
  }

  /* ---------------------------------------------------------------
     6. Interprétation des styles
     --------------------------------------------------------------- */
  function couleurRGB(v, palette) {
    if (v == null) return null;
    if ((v >>> 24) === 0x08) {
      const i = v & 0xff;
      return palette[i] || '#000000';
    }
    if ((v >>> 24) > 0x08) return null;
    const r = v & 0xff, g = (v >> 8) & 0xff, b = (v >> 16) & 0xff;
    return '#' + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('');
  }

  function styleCaractere(dv, blocs, Q, palette) {
    const s = {};
    const ids = new Map();
    for (const b of blocs) if (!ids.has(b.id)) ids.set(b.id, b);
    if (ids.has(0x0c)) s.taille = Math.round(ids.get(0x0c).val / EMU_PT * 2) / 2;
    if (ids.has(0x02) || ids.has(0x37)) s.gras = true;
    if (ids.has(0x03) || ids.has(0x38)) s.italique = true;
    if (ids.has(0x1e) && (ids.get(0x1e).val & 0xff)) s.souligne = true;
    if (ids.has(0x24)) {
      const b = ids.get(0x24);
      const entrees = b.varia ? sousBlocs(dv, b) : [];
      let idx = null;
      const e0 = entrees.find(e => e.id === 0) || entrees[0];
      if (e0 && e0.varia) {
        const f = sousBlocs(dv, e0).find(x => x.type === 0x18);
        if (f) idx = f.val;
      }
      if (idx != null && Q.polices[idx]) s.police = Q.polices[idx];
    }
    let ci = null;
    for (const k of [0x44, 0x2e]) {
      if (ids.has(k) && ci == null) {
        const b = ids.get(k);
        if (b.varia) { const x = sousBlocs(dv, b).find(y => y.type === 0x22 || y.type === 0x20); if (x) ci = x.val; }
        else ci = b.val;
      }
    }
    if (ci != null && Q.couleursTexte[ci] != null) s.couleur = couleurRGB(Q.couleursTexte[ci], palette);
    if (ids.has(0x2f)) { const v = ids.get(0x2f).val; if (v === 1) s.exposant = true; else if (v === 2) s.indice = true; }
    return s;
  }

  const ALIGN = { 0: 'left', 1: 'right', 2: 'center', 3: 'justify', 6: 'justify' };

  function styleParagraphe(dv, blocs) {
    const s = {};
    const ids = new Map();
    for (const b of blocs) if (!ids.has(b.id)) ids.set(b.id, b);
    if (ids.has(0x04)) s.align = ALIGN[ids.get(0x04).val & 0xff] || 'left';
    if (ids.has(0x0c)) s.retrait1 = s32(ids.get(0x0c).val) / EMU_MM;
    if (ids.has(0x0d)) s.retraitG = s32(ids.get(0x0d).val) / EMU_MM;
    if (ids.has(0x0e)) s.retraitD = s32(ids.get(0x0e).val) / EMU_MM;
    if (ids.has(0x12)) s.avant = ids.get(0x12).val / EMU_PT;
    if (ids.has(0x13)) s.apres = ids.get(0x13).val / EMU_PT;
    if (ids.has(0x34)) {
      const v = ids.get(0x34).val;
      // bit 2 : en « sp » (interlignes simples), 1 sp = 914 400 (vérifié sur le PDF de trame de base :
      // 0x129A82 = 1,33 sp) ; bit 1 : en points (EMU)
      if (v & 2) s.interligne = Math.round((v & ~3) / 914400 * 1000) / 1000;
      else if (v & 1) s.interligneP = Math.round((v & ~3) / EMU_PT * 10) / 10;
    }
    if (ids.has(0x57) && ids.get(0x57).varia) {
      const l = sousBlocs(dv, ids.get(0x57));
      const c = l.find(x => x.id === 1);
      s.puce = c ? c.val : 0x2022;
    }
    return s;
  }

  /* ---------------------------------------------------------------
     7. Texte -> HTML
     --------------------------------------------------------------- */
  const echapper = t => t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  function cssCar(s, base) {
    const st = [];
    const police = s.police || base.police;
    if (police) st.push(`font-family:'${police.replace(/'/g, '')}'`);
    const taille = s.taille || base.taille;
    if (taille) st.push(`font-size:${taille}pt`);
    if (s.gras) st.push('font-weight:bold');
    if (s.italique) st.push('font-style:italic');
    if (s.souligne) st.push('text-decoration:underline');
    if (s.couleur && s.couleur !== '#000000') st.push(`color:${s.couleur}`);
    if (s.exposant) st.push('vertical-align:super;font-size:smaller');
    if (s.indice) st.push('vertical-align:sub;font-size:smaller');
    return st.join(';');
  }

  // hauteur de ligne naturelle des polices courantes (en fraction de la taille)
  const RATIO_POLICE = { 'calibri': 1.221, 'calibri light': 1.221, 'cambria': 1.172, 'arial': 1.149, 'arial black': 1.41, 'arial narrow': 1.149, 'times new roman': 1.15,
    'verdana': 1.215, 'tahoma': 1.207, 'georgia': 1.136, 'segoe ui': 1.33, 'comic sans ms': 1.394, 'trebuchet ms': 1.161, 'courier new': 1.133,
    'impact': 1.219, 'garamond': 1.12, 'century gothic': 1.226, 'book antiqua': 1.17, 'bookman old style': 1.17, 'franklin gothic medium': 1.134, 'candara': 1.221, 'corbel': 1.221, 'constantia': 1.221 };
  const ratioPolice = n => RATIO_POLICE[(n || '').toLowerCase()] || 1.15;

  function cssPar(p, police, taille) {
    const st = [];
    if (p.align && p.align !== 'left') st.push(`text-align:${p.align}`);
    if (p.retraitG) st.push(`margin-left:${+p.retraitG.toFixed(2)}mm`);
    if (p.retraitD) st.push(`margin-right:${+p.retraitD.toFixed(2)}mm`);
    if (p.retrait1) st.push(`text-indent:${+p.retrait1.toFixed(2)}mm`);
    if (p.avant) st.push(`margin-top:${+p.avant.toFixed(1)}pt`);
    if (p.apres) st.push(`margin-bottom:${+p.apres.toFixed(1)}pt`);
    // format .pub : interligne = sp × 1,2 × hauteur naturelle de la police (mesuré sur un PDF imprimé depuis l'application d'origine)
    if (p.interligne) {
      st.push(`line-height:${+(p.interligne * 1.2 * ratioPolice(police)).toFixed(3)}`);
      // la ligne « vide » du paragraphe compte aussi : même taille que son texte
      if (taille) st.push(`font-size:${taille}pt`);
    }
    if (p.interligneP) st.push(`line-height:${+p.interligneP.toFixed(1)}pt`);
    return st.join(';');
  }

  function fabriqueTexte(Q, palette) {
    const dv = Q.dv;
    const cacheC = new Map(), cacheP = new Map();
    const base = styleCaractere(dv, Q.defCar, Q, palette);
    if (!base.police) base.police = Q.polices[0] || 'Times New Roman';
    if (!base.taille) base.taille = 10;

    function runA(runs, pos) {
      // premier run dont la fin dépasse pos
      let lo = 0, hi = runs.length - 1, r = -1;
      while (lo <= hi) {
        const m = (lo + hi) >> 1;
        if (runs[m].fin > pos) { r = m; hi = m - 1; } else lo = m + 1;
      }
      return r;
    }
    function sCar(i) {
      if (i < 0) return {};
      if (!cacheC.has(i)) cacheC.set(i, styleCaractere(dv, Q.runsCar[i].blocs, Q, palette));
      return cacheC.get(i);
    }
    function sPar(i) {
      if (i < 0) return {};
      if (!cacheP.has(i)) cacheP.set(i, styleParagraphe(dv, Q.runsPar[i].blocs));
      return cacheP.get(i);
    }

    // HTML d'un intervalle [debut, fin) du texte global
    function html(debut, fin) {
      const t = Q.texte;
      let out = '';
      let p = debut;
      while (p < fin) {
        let q = t.indexOf('\r', p);
        if (q < 0 || q >= fin) q = fin;
        const ps = sPar(runA(Q.runsPar, Math.max(p, q === fin ? p : q)));
        let contenu = '';
        let tailleMax = 0;
        let i = p;
        while (i < q) {
          const ri = runA(Q.runsCar, i);
          const fr = ri >= 0 ? Math.min(Q.runsCar[ri].fin, q) : q;
          const finRun = fr > i ? fr : q;
          const s = sCar(ri);
          tailleMax = Math.max(tailleMax, s.taille || base.taille);
          let morceau = t.slice(i, finRun)
            .replace(/[\u0000-\u0008\u000c\u000e-\u001f]/g, '');
          morceau = echapper(morceau).replace(/\u000b/g, '<br>');
          if (morceau) contenu += `<span style="${cssCar(s, base)}">${morceau}</span>`;
          i = finRun;
        }
        // caractère de fin de paragraphe : donne la taille d'une ligne vide
        const sFin = sCar(runA(Q.runsCar, q < fin ? q : Math.max(p, q - 1)));
        if (!contenu) contenu = `<span style="${cssCar(sFin, base)}"><br></span>`;
        let puce = '';
        if (ps.puce) {
          const c = ps.puce;
          const car = c < 0x100 ? `<span style="font-family:Wingdings">${echapper(String.fromCharCode(c))}</span>` : echapper(String.fromCharCode(c));
          puce = `<span class="puce" contenteditable="false" style="${cssCar(sFin, base)}">${car} </span>`;
        }
        const s0 = sCar(runA(Q.runsCar, p));
        out += `<p style="${cssPar(ps, s0.police || base.police, s0.taille || base.taille)}">${puce}${contenu}</p>`;
        p = q + 1;
        if (q === fin) break;
      }
      return out;
    }
    return { html, base };
  }

  /* ---------------------------------------------------------------
     8. Construction de la fiche
     --------------------------------------------------------------- */
  function enBase64(u8) {
    if (typeof Buffer !== 'undefined' && typeof window === 'undefined') return Buffer.from(u8).toString('base64');
    let s = '';
    for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
    return btoa(s);
  }

  const mm = emu => Math.round(emu / EMU_MM * 100) / 100;

  function lirePub(entree, options) {
    options = options || {};

      case 'plus': case 'croix': { const d = Math.min(w, h) * A(5400); return P([[d, 0], [w - d, 0], [w - d, d], [w, d], [w, h - d], [w - d, h - d], [w - d, h], [d, h], [d, h - d], [0, h - d], [0, d], [d, d]]); }

      case 'etoile5': return etoile(w, h, 5, 0.38);

      case 'etoile16': return etoile(w, h, 16, 0.8);

      case 'flecheB': { const y = h * A(16200), e = w * 0.25; return P([[e, 0], [e, y], [0, y], [w / 2, h], [w, y], [w - e, y], [w - e, 0]]); }

  function bulle(o) {
    const w = o.w, h = o.h;
    const tx = w * (o.ajust != null ? o.ajust : 1350) / 21600;

    const dx = tx - cx, dy = ty - cy;

    if (Math.abs(dy) * w >= Math.abs(dx) * h) {

  function libre(o) {
    const g = o.geometrie;
    if (!g || !g.pts.length) return `M0 0H${f2(o.w)}V${f2(o.h)}H0Z`;

    const sx = o.w / ((gr - gl) || 1), sy = o.h / ((gb - gt) || 1);

    d.style.height = Math.max(o.h, 0) + 'mm';

    return b ? `${Math.max(b.e * PT_MM, 0.1).toFixed(2)}mm solid ${b.c}` : '';

  function tableau(o, d) {
    const T = o.tableau;
    const t = document.createElement('table');
    t.className = 'tab';
    const cg = document.createElement('colgroup');
    for (const c of T.cols) { const col = document.createElement('col'); col.style.width = c + 'mm'; cg.appendChild(col); }
    t.appendChild(cg);
    const nl = T.lignes.length, nc = T.cols.length;
    const occupe = Array.from({ length: nl }, () => Array(nc).fill(null));
    T.cellules.forEach((c, i) => {
      for (let r = c.l; r < Math.min(c.l + c.nl, nl); r++) for (let k = c.c; k < Math.min(c.c + c.nc, nc); k++) occupe[r][k] = i;
    });

      for (let k = 0; k < nc; k++) {

          if (b.b) td.style.borderBottom = cssBord(b.b);
          if (b.g) td.style.borderLeft = cssBord(b.g);
          if (b.d) td.style.borderRight = cssBord(b.d);
          if (c.vertical) td.style.verticalAlign = c.vertical === 'milieu' ? 'middle' : c.vertical === 'bas' ? 'bottom' : 'top';

  /* ---- habillage : le texte contourne les objets posés dessus ----

  function rectObjet(o) {

  /* ---- habillage « serré » : bandes horizontales qui suivent la forme exacte ----

  let ctxTest = null;

  function bandesObjet(b, dist) {

    const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
    const local = (x, y) => {
      let lx = (x - cx) * ca - (y - cy) * sa + b.w / 2, ly = (x - cx) * sa + (y - cy) * ca + b.h / 2;
      if (b.miroirH) lx = b.w - lx;
      if (b.miroirV) ly = b.h - ly;
      return [lx, ly];

    let dedans = null;
    if (b.type === 'forme' || (b.type === 'texte' && b.forme && b.forme !== 'rect')) {
      if (!ctxTest) ctxTest = document.createElement('canvas').getContext('2d');
      const p = new Path2D(chemin(b));
      dedans = (x, y) => { const [lx, ly] = local(x, y); return ctxTest.isPointInPath(p, lx, ly); };
    } else if (b.type === 'image' && profilsImages[b.image]) {
      const pr = profilsImages[b.image], n = pr.length;
      const [t, rr, bb, l] = b.rognage || [0, 0, 0, 0];
      dedans = (x, y) => {

        const u = l + lx / b.w * (1 - l - rr), v = t + ly / b.h * (1 - t - bb);
        const row = pr[Math.min(n - 1, Math.floor(v * n))];

    }
    if (!dedans) return [{ x1: r.x - dist, x2: r.x + r.w + dist, y1: r.y - dist, y2: r.y + r.h + dist }];
    const bandes = [];
    for (let y = r.y; y < r.y + r.h; y += pas) {
      let x1 = Infinity, x2 = -Infinity;
      for (let x = r.x; x <= r.x + r.w; x += 0.5) {

/* ==== editeur_noyau.js ==== */
/* =====================================================================
   Éditeur : état, affichage, sélection, règles, zoom, historique
   ===================================================================== */
'use strict';
const PX_MM = 96 / 25.4;
const MARGE_SCENE = 70;
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => [...(r || document).querySelectorAll(s)];
const arrondi = (v, n = 2) => Math.round(v * 10 ** n) / 10 ** n;
const cm = v => arrondi(v / 10, 2).toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

const E = {
  fiche: null,      // document courant
  ip: 0,            // index de la page affichée
  sel: [],          // identifiants sélectionnés
  zoom: 1,
  edition: null,    // { id, avant } pendant la saisie de texte
  histo: [], refaire: [],
  modifie: false,
  poignee: null,    // fichier (File System Access) pour « Enregistrer »
  nomFichier: null,
  dessin: null,     // mode insertion : { type, forme }
  cellules: [],     // cellules de tableau choisies (indices) pendant l'édition
  presse: null,     // presse-papiers interne
  options: { regles: true, reperes: true, limites: true, volet: true, magnetisme: true },
  feuille: null, calque: null, ox: 0, oy: 0
};

/* ---------------- modèle ---------------- */
let compteurId = 0;
function nouvelId(prefixe) { return (prefixe || 'o') + Date.now().toString(36) + (++compteurId).toString(36); }
const copie = o => JSON.parse(JSON.stringify(o));
// en mode « page maître », on travaille sur les pages maîtres au lieu des pages
function pagesActives() { return E.modeMaitre ? Object.values(E.fiche.maitres) : E.fiche.pages; }
function pageCourante() { return pagesActives()[E.ip]; }
function numeroCourant() { return E.modeMaitre ? null : E.ip + 1; }
function ctxObjet(o) {
  const obs = Rendu.obstacles(o, pageCourante().items);
  // habillage serré autour d'une image : il faut son profil de transparence (calculé en arrière-plan)
  for (const b of obs) if (b.type === 'image' && b.habillage === 'serre' && typeof profilImage === 'function') profilImage(b.image);
  return { obstacles: obs, numero: numeroCourant(), total: E.fiche.pages.length };
}
function objetParId(id) { return pageCourante().items.find(o => o.id === id) || null; }
function selection() { return E.sel.map(objetParId).filter(Boolean); }
function elementObjet(id) { return E.calque ? E.calque.querySelector(`.objet[data-id="${CSS.escape(id)}"]`) : null; }

function normaliserFiche(f) {
  if (!f || !Array.isArray(f.pages)) throw new Error('Fiche illisible.');
  f.format = 'pagelibre';
  f.version = f.version || 1;
  f.titre = f.titre || 'Sans titre';
  f.page = f.page || { w: 210, h: 297 };
  f.page.marges = f.page.marges || [12.7, 12.7, 12.7, 12.7]; // haut, droite, bas, gauche
  f.images = f.images || {};
  f.maitres = f.maitres || {};
  f.palette = f.palette || ['#000000'];
  if (!f.pages.length) f.pages.push({ id: nouvelId('p'), maitre: null, items: [] });
  const vus = new Set();
  for (const p of [...f.pages, ...Object.values(f.maitres)]) {
    p.items = p.items || [];
    for (const o of p.items) {
      if (!o.id || vus.has(o.id)) o.id = nouvelId();
      vus.add(o.id);
    }
  }
  delete f.avertissements;
  return f;
}

function ficheVierge(w, h, titre) {
  return normaliserFiche({ titre: titre || 'Sans titre', page: { w, h }, pages: [{ id: nouvelId('p'), maitre: null, items: [] }] });
}

/* ---------------- historique ---------------- */
function instantane() {
  const f = E.fiche;
  return JSON.stringify({ pages: f.pages, maitres: f.maitres, page: f.page, titre: f.titre, styles: f.styles || [] });
}
function avant() {
  const s = instantane();
  if (E.histo[E.histo.length - 1] !== s) E.histo.push(s);
  if (E.histo.length > 150) E.histo.shift();
  E.refaire = [];
}
function apres(opt) {
  opt = opt || {};
  E.modifie = true;
  rafraichirDependances();
  majTitre();
  planifierAutosave();
  planifierVignette(E.ip);
  if (!opt.sansUI) { majSelectionUI(); majRuban(); }
}
// après une modification : texte qui contourne les objets, cadres chaînés
function rafraichirDependances() {
  if (!E.calque) return;
  if (typeof refluerChaines === 'function') refluerChaines();
  for (const o of pageCourante().items) {
    if (o.type !== 'texte' || (E.edition && E.edition.id === o.id)) continue;
    const el = elementObjet(o.id);
    const avait = el && el.querySelector('.habillage');
    if (avait || Rendu.obstacles(o, pageCourante().items).length) redessinerObjet(o);
  }
}
function restaurer(s) {
  const d = JSON.parse(s);
  Object.assign(E.fiche, d);
  if (E.modeMaitre && !E.fiche.maitres[E.modeMaitre.retour] && !Object.keys(E.fiche.maitres).length) E.modeMaitre = null;
  E.ip = Math.max(0, Math.min(E.ip, pagesActives().length - 1));
  E.sel = E.sel.filter(id => objetParId(id));
  afficherPage();
  dessinerVignettes();
  E.modifie = true;
  majTitre();
  planifierAutosave();
}
function annuler() {
  if (E.edition) { document.execCommand('undo'); return; }
  if (!E.histo.length) return;
  E.refaire.push(instantane());
  restaurer(E.histo.pop());
}
function refaire() {
  if (E.edition) { document.execCommand('redo'); return; }
  if (!E.refaire.length) return;
  E.histo.push(instantane());
  restaurer(E.refaire.pop());
}

/* ---------------- affichage de la page ---------------- */
function afficherPage() {
  quitterEdition();
  const hote = $('#feuille-hote');
  hote.innerHTML = '';
  const f = Rendu.page(pageCourante(), E.fiche, { numero: numeroCourant() });
  const [mh, md, mb, mg] = E.fiche.page.marges;
  f.style.setProperty('--mh', mh + 'mm'); f.style.setProperty('--md', md + 'mm');
  f.style.setProperty('--mb', mb + 'mm'); f.style.setProperty('--mg', mg + 'mm');
  hote.appendChild(f);
  E.feuille = f;
  E.calque = f.querySelector('.calque-objets');
  E.sel = E.sel.filter(id => objetParId(id));
  // affichage deux pages : la page voisine, non modifiable tant qu'on n'a pas cliqué dessus
  $$('#scene > .feuille-voisine').forEach(x => x.remove());
  const iv = indexVoisine();
  if (iv != null) {
    const v = document.createElement('div');
    v.className = 'feuille-voisine';
    v.title = `Page ${iv + 1} : cliquer pour la modifier`;
    v.appendChild(Rendu.page(pagesActives()[iv], E.fiche, { numero: E.modeMaitre ? null : iv + 1 }));
    v.addEventListener('pointerdown', ev => { ev.stopPropagation(); allerPage(iv); });
    $('#scene').appendChild(v);
    Rendu.postMiseEnPage(v);
  }
  majScene();
  Rendu.postMiseEnPage(f);
  for (const o of pageCourante().items) apresRendu(o, elementObjet(o.id));
  majSelectionUI();
  majEtat();
  majVignettesActive();
  majRuban();
}

function redessinerObjet(o) {
  const ancien = elementObjet(o.id);
  const n = Rendu.objet(o, E.fiche, ctxObjet(o));
  if (ancien) {
    if (ancien.classList.contains('choisi')) n.classList.add('choisi');
    ancien.replaceWith(n);
  } else E.calque.appendChild(n);
  Rendu.postMiseEnPage(n);
  apresRendu(o, n);
  return n;
}

function redessinerCalque() {
  quitterEdition();
  E.calque.innerHTML = '';
  for (const o of pageCourante().items) {
    const n = Rendu.objet(o, E.fiche, ctxObjet(o));
    E.calque.appendChild(n);
    Rendu.postMiseEnPage(n);
    apresRendu(o, n);
  }
  majSelectionUI();
}

// après le rendu d'un objet : tableaux qui débordent, texte trop long
function apresRendu(o, el) {
  if (!el) return;
  if (o.type === 'tableau') {
    const t = el.querySelector('table');
    if (t) {
      const h = t.offsetHeight / PX_MM;
      if (h > o.h + 0.3) { o.h = arrondi(h); el.style.height = o.h + 'mm'; }
    }
  } else if (o.type === 'texte') {
    if (o.ajuster && !(E.edition && E.edition.id === o.id)) ajusterTexte(o, el);
    verifierDebordement(o, el);
  }
}

/* « Ajuster le texte » (comme en PAO) :
   reduire = réduire le texte qui dépasse ; meilleur = remplir le cadre au mieux ; cadre = adapter la hauteur du cadre */
function hauteurUtile(el) {
  const cadre = el.querySelector('.cadre-texte'), cs = getComputedStyle(cadre);
  return cadre.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
}
function ajusterTexte(o, el) {
  const z = el.querySelector('.contenu');
  if (!z) return;
  if (o.ajuster === 'cadre') {
    z.style.zoom = '';
    const m = o.marges || [2.54, 1.27, 2.54, 1.27];
    const h = arrondi(z.scrollHeight / PX_MM + m[1] + m[3] + 0.3);
    delete o.ajustement;
    if (Math.abs(h - o.h) > 0.2) { o.h = h; el.style.height = h + 'mm'; }
    return;
  }
  const dispo = hauteurUtile(el);
  const tient = k => { z.style.zoom = k; return z.scrollHeight * k <= dispo + 1 && z.scrollWidth * k <= z.parentElement.clientWidth + 2; };
  let k = 1;
  if (!tient(1) || o.ajuster === 'meilleur') {
    let lo = 0.2, hi = o.ajuster === 'meilleur' ? 6 : 1;
    if (tient(hi)) lo = hi;
    for (let i = 0; i < 14; i++) { const m = (lo + hi) / 2; if (tient(m)) lo = m; else hi = m; }
    k = arrondi(lo, 3);
  }
  z.style.zoom = k === 1 ? '' : k;
  if (k === 1) delete o.ajustement; else o.ajustement = k;
  // les flottants d'habillage dépendent du zoom : on les recalcule
  if (z.querySelector('.habillage')) {
    z.querySelectorAll('.habillage').forEach(h => h.remove());
    const n = Rendu.objet(o, E.fiche, ctxObjet(o)).querySelectorAll('.contenu > .habillage');
    [...n].reverse().forEach(h => z.insertBefore(h, z.firstChild));
  }
}

function indexVoisine() {
  if (!E.options.deuxPages) return null;
  const n = pagesActives().length, i = E.ip;
  if (E.modeMaitre || n < 2) return null;
  // page 1 seule (couverture), puis 2-3, 4-5…
  if (i === 0) return null;
  const j = i % 2 === 1 ? i + 1 : i - 1;
  return j < n ? j : null;
}
function verifierDebordement(o, el) {
  const cadre = el.querySelector('.cadre-texte'), z = el.querySelector('.contenu');
  if (!cadre || !z) return;
  const cs = getComputedStyle(cadre);
  const vertical = o.sensTexte;
  let deborde;
  const tol = 6; // px : les métriques des polices diffèrent un peu de l'application d'origine
  if (o.colonnes > 1) deborde = z.scrollWidth > z.clientWidth + tol;
  else if (vertical) deborde = z.scrollWidth > cadre.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) + tol;
  else deborde = z.scrollHeight > cadre.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) + tol;
  el.classList.toggle('deborde', deborde);
}

function majScene() {
  const def = $('#defile');
  const w = E.fiche.page.w * PX_MM * E.zoom, h = E.fiche.page.h * PX_MM * E.zoom;
  const iv = indexVoisine();
  const total = iv != null ? 2 * w : w;
  const ox0 = Math.max(MARGE_SCENE, (def.clientWidth - total) / 2);
  // la page de gauche d'une double page porte un numéro pair (index impair)
  const activeADroite = iv != null && iv < E.ip;
  E.ox = activeADroite ? ox0 + w : ox0;
  E.oy = Math.max(MARGE_SCENE * 0.6, (def.clientHeight - h) / 2);
  const sc = $('#scene');
  sc.style.width = (total + 2 * ox0) + 'px';
  sc.style.height = (h + 2 * E.oy) + 'px';
  const hote = $('#feuille-hote');
  hote.style.left = E.ox + 'px';
  hote.style.top = E.oy + 'px';
  hote.style.transform = `scale(${E.zoom})`;
  const v = $('#scene > .feuille-voisine');
  if (v) {
    v.style.left = (activeADroite ? ox0 : ox0 + w) + 'px';
    v.style.top = E.oy + 'px';
    v.style.transform = `scale(${E.zoom})`;
  }
  dessinerGuides();
  majRegles();
}

/* guides de règle (verts, communs à toutes les pages) */
function dessinerGuides() {
  let c = $('#calque-guides');
  if (!c) { c = document.createElement('div'); c.id = 'calque-guides'; $('#scene').appendChild(c); }
  c.innerHTML = '';

  // grille de mise en page (bleue) et lignes de base (fines)

  const trait = (cls, x, y, w, h) => { const d = document.createElement('div'); d.className = cls; d.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${h}px`; c.appendChild(d); };
  for (const x of R.v) trait('repere-grille v', E.ox + x * k, E.oy, 1, P.h * k);
  for (const y of R.h) trait('repere-grille h', E.ox, E.oy + y * k, P.w * k, 1);
  for (const y of R.base) trait('ligne-base', E.ox + P.marges[3] * k, E.oy + y * k, (P.w - P.marges[1] - P.marges[3]) * k, 1);
  (E.fiche.page.guides || []).forEach((g, i) => {

/* conversions */
function versMM(ev) {
  const r = E.feuille.getBoundingClientRect();
  const k = PX_MM * E.zoom;
  return { x: (ev.clientX - r.left) / k, y: (ev.clientY - r.top) / k };
}
function mmVersScene(x, y) { const k = PX_MM * E.zoom; return { x: E.ox + x * k, y: E.oy + y * k }; }

function boiteEnglobante(objs) {
  let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
  for (const o of objs) {
    const coins = coinsObjet(o);
    for (const [x, y] of coins) { x1 = Math.min(x1, x); y1 = Math.min(y1, y); x2 = Math.max(x2, x); y2 = Math.max(y2, y); }
  }
  return { x: x1, y: y1, w: x2 - x1, h: y2 - y1 };
}
function coinsObjet(o) {
  const cx = o.x + o.w / 2, cy = o.y + o.h / 2;
  const a = (o.rot || 0) * Math.PI / 180, c = Math.cos(a), s = Math.sin(a);
  return [[-1, -1], [1, -1], [1, 1], [-1, 1]].map(([dx, dy]) => {
    const lx = dx * o.w / 2, ly = dy * o.h / 2;
    return [cx + lx * c - ly * s, cy + lx * s + ly * c];
  });
}

/* ---------------- sélection : cadres et poignées ---------------- */
function groupeEntier(objs) {
  if (objs.length < 2) return false;
  const g = objs[0].groupe;
  if (!g || objs.some(o => o.groupe !== g)) return false;
  return pageCourante().items.filter(o => o.groupe === g).length === objs.length;
}

function majSelectionUI() {

function cadreSel(o, opt) {
  const k = PX_MM * E.zoom;
  const p = mmVersScene(o.x, o.y);
  const d = document.createElement('div');
  d.className = 'cadre-sel ' + (opt.classe || '') + (E.edition && E.edition.id === o.id ? ' edition' : '');
  d.style.left = p.x + 'px';
  d.style.top = p.y + 'px';
  d.style.width = Math.max(o.w * k, 1) + 'px';
  d.style.height = Math.max(o.h * k, 1) + 'px';
  if (o.rot) d.style.transform = `rotate(${o.rot}deg)`;
  if (opt.poignees) {
    if (o.type === 'ligne') {
      const [a, b] = extremitesLigne(o);
      d.style.border = '0';
      for (const [nom, pt] of [['a', a], ['b', b]]) {
        const h = document.createElement('div');
        h.className = 'poignee p-' + nom;
        h.dataset.poignee = nom;
        h.style.left = ((pt[0] - o.x) * k) + 'px';
        h.style.top = ((pt[1] - o.y) * k) + 'px';
        d.appendChild(h);
      }
      return d;
    }
    // bandes de bord : on saisit le cadre par là pour le déplacer
    for (const cote of ['h', 'd', 'b', 'g']) {
      const bd = document.createElement('div');
      bd.className = 'bord-sel bord-' + cote;
      d.appendChild(bd);
    }
    const petit = o.w * k < 26 || o.h * k < 26;
    const pos = { nw: [0, 0], n: [50, 0], ne: [100, 0], e: [100, 50], se: [100, 100], s: [50, 100], sw: [0, 100], w: [0, 50] };
    for (const nom in pos) {
      if (petit && nom.length === 1) continue;
      const h = document.createElement('div');
      h.className = 'poignee p-' + nom;
      h.dataset.poignee = nom;
      h.style.left = pos[nom][0] + '%';
      h.style.top = pos[nom][1] + '%';
      d.appendChild(h);
    }
    const tige = document.createElement('div');
    tige.className = 'tige-rot';
    tige.style.left = '50%'; tige.style.top = '-18px'; tige.style.height = '18px';
    d.appendChild(tige);
    const r = document.createElement('div');
    r.className = 'poignee p-rot';
    r.dataset.poignee = 'rot';
    r.style.left = '50%'; r.style.top = '-22px';
    r.title = 'Faire pivoter (Maj : par pas de 15°)';
    d.appendChild(r);
  }
  return d;
}

function extremitesLigne(o) {
  let a = [o.x, o.y], b = [o.x + o.w, o.y + o.h];
  if (o.miroirH) { a[0] = o.x + o.w; b[0] = o.x; }
  if (o.miroirV) { a[1] = o.y + o.h; b[1] = o.y; }
  return [a, b];
}
function ligneDepuisPoints(o, a, b) {
  o.x = arrondi(Math.min(a[0], b[0])); o.y = arrondi(Math.min(a[1], b[1]));
  o.w = arrondi(Math.abs(b[0] - a[0])); o.h = arrondi(Math.abs(b[1] - a[1]));
  o.miroirH = b[0] < a[0] || undefined;
  o.miroirV = b[1] < a[1] || undefined;
  if (!o.miroirH) delete o.miroirH;
  if (!o.miroirV) delete o.miroirV;
}

function choisir(ids, ajouter) {
  if (E.edition && !ids.includes(E.edition.id)) quitterEdition();
  E.sel = ajouter ? [...new Set([...E.sel, ...ids])] : [...ids];

function deselectionner() { quitterEdition(); E.sel = []; E.cellules = []; majSelectionUI(); majRuban(); }

// un clic sur un membre de groupe sélectionne tout le groupe
function idsAvecGroupe(o) {

/* ---------------- zoom ---------------- */
function definirZoom(z, ancre) {
  z = Math.max(0.1, Math.min(4, z));
  const def = $('#defile');
  const ax = ancre ? ancre.x : def.clientWidth / 2, ay = ancre ? ancre.y : def.clientHeight / 2;
  // point de la page sous l'ancre
  const k = PX_MM * E.zoom;
  const mx = (def.scrollLeft + ax - E.ox) / k, my = (def.scrollTop + ay - E.oy) / k;
  E.zoom = z;
  majScene();
  const k2 = PX_MM * E.zoom;
  def.scrollLeft = E.ox + mx * k2 - ax;
  def.scrollTop = E.oy + my * k2 - ay;
  majSelectionUI();
  majRegles();
  majEtat();
}
function zoomPage() {
  const def = $('#defile');
  const z = Math.min((def.clientWidth - 40) / (E.fiche.page.w * PX_MM), (def.clientHeight - 30) / (E.fiche.page.h * PX_MM));
  definirZoom(z);
  centrerVue();
}
function zoomLargeur() {
  const def = $('#defile');
  definirZoom((def.clientWidth - 50) / (E.fiche.page.w * PX_MM));
  def.scrollLeft = (def.scrollWidth - def.clientWidth) / 2;
}
function centrerVue() {
  const def = $('#defile');
  def.scrollLeft = (def.scrollWidth - def.clientWidth) / 2;
  def.scrollTop = (def.scrollHeight - def.clientHeight) / 2;
}

/* ---------------- règles ---------------- */
function majRegles() {
  if (!E.feuille || !E.options.regles) return;
  const def = $('#defile');
  const k = PX_MM * E.zoom;
  const dpr = window.devicePixelRatio || 1;
  const objs = selection();
  const b = objs.length ? (objs.length === 1 ? objs[0] : boiteEnglobante(objs)) : null;
  for (const sens of ['h', 'v']) {
    const cv = $('#regle-' + sens);
    const L = sens === 'h' ? cv.clientWidth : cv.clientHeight;
    const T = 22;
    cv.width = (sens === 'h' ? L : T) * dpr;
    cv.height = (sens === 'h' ? T : L) * dpr;
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.fillStyle = '#e4e4e4';
    c.fillRect(0, 0, sens === 'h' ? L : T, sens === 'h' ? T : L);
    const origine = sens === 'h' ? E.ox - def.scrollLeft : E.oy - def.scrollTop;
    const taille = (sens === 'h' ? E.fiche.page.w : E.fiche.page.h) * k;
    c.fillStyle = '#fff';
    if (sens === 'h') c.fillRect(origine, 0, taille, T); else c.fillRect(0, origine, T, taille);
    if (b) {
      c.fillStyle = '#cfe0f0';
      const d0 = origine + (sens === 'h' ? b.x : b.y) * k, d1 = (sens === 'h' ? b.w : b.h) * k;
      if (sens === 'h') c.fillRect(d0, 0, d1, T); else c.fillRect(0, d0, T, d1);
    }
    // pas : au moins 45 px entre deux graduations numérotées
    const pas = [1, 2, 5, 10, 20, 50, 100, 200].find(p => p * k >= 45) || 200;
    const sous = pas >= 10 ? (pas === 20 ? 4 : 5) : pas === 5 ? 5 : 2;
    c.strokeStyle = '#8a8a8a';
    c.fillStyle = '#555';
    c.font = '10px Segoe UI';
    c.lineWidth = 1;
    const debut = Math.floor(-origine / k / pas) * pas - pas, fin = (L - origine) / k + pas;
    c.beginPath();
    for (let v = debut; v <= fin; v += pas / sous) {
      const p = Math.round(origine + v * k) + 0.5;
      const majeur = Math.abs(v / pas - Math.round(v / pas)) < 1e-6;
      const lg = majeur ? 9 : (sous === 4 || sous === 2 ? 4 : (Math.abs((v * 2 / pas) % 1) < 1e-6 ? 6 : 4));
      if (sens === 'h') { c.moveTo(p, T); c.lineTo(p, T - lg); } else { c.moveTo(T, p); c.lineTo(T - lg, p); }
      if (majeur) {
        const lib = pas >= 10 ? String(v / 10) : String(v);
        if (sens === 'h') c.fillText(lib, p + 2, 10);
        else { c.save(); c.translate(10, p + 2); c.rotate(-Math.PI / 2); c.fillText(lib, -c.measureText(lib).width - 2, 0); c.restore(); }
      }
    }
    c.stroke();
    c.strokeStyle = '#b9b9b9';
    c.beginPath();
    if (sens === 'h') { c.moveTo(0, T - 0.5); c.lineTo(L, T - 0.5); } else { c.moveTo(T - 0.5, 0); c.lineTo(T - 0.5, L); }
    c.stroke();
  }
}

/* ---------------- pages ---------------- */
function insererPage(dupliquer) {
  quitterEdition();
  avant();
  if (E.modeMaitre) {
    const m = dupliquer ? copie(pageCourante()) : { items: [] };
    m.id = nouvelId('m');
    m.nom = dupliquer ? (pageCourante().nom || '') + ' (copie)' : 'Page maître ' + String.fromCharCode(65 + pagesActives().length);
    for (const o of m.items) o.id = nouvelId();
    renommerGroupes(m.items);
    E.fiche.maitres[m.id] = m;
    E.ip = pagesActives().length - 1;
    E.sel = [];
    dessinerVignettes();
    afficherPage();
    apres();
    return;
  }
  const p = dupliquer ? copie(pageCourante()) : { maitre: pageCourante().maitre, items: [] };
  p.id = nouvelId('p');
  for (const o of p.items) { o.id = nouvelId(); delete o.suivant; delete o.precedent; }
  if (dupliquer) renommerGroupes(p.items);
  E.fiche.pages.splice(E.ip + 1, 0, p);
  E.ip++;
  E.sel = [];
  dessinerVignettes();
  afficherPage();
  apres();
}
function supprimerPage() {
  if (E.modeMaitre) {
    const m = pageCourante();
    confirmer(`Supprimer la page maître « ${m.nom || String.fromCharCode(65 + E.ip)} » ? Les pages qui l'utilisent n'auront plus de page maître.`, () => {
      avant();
      delete E.fiche.maitres[m.id];
      for (const p of E.fiche.pages) if (p.maitre === m.id) p.maitre = null;
      if (!Object.keys(E.fiche.maitres).length) { quitterModeMaitre(); apres(); return; }
      E.ip = Math.min(E.ip, pagesActives().length - 1);
      E.sel = [];
      dessinerVignettes();
      afficherPage();
      apres();
    });
    return;
  }
  if (E.fiche.pages.length < 2) { alerte('Une publication garde au moins une page.'); return; }
  confirmer(`Supprimer la page ${E.ip + 1} et tout son contenu ?`, () => {
    avant();
    E.fiche.pages.splice(E.ip, 1);
    E.ip = Math.min(E.ip, E.fiche.pages.length - 1);
    E.sel = [];
    dessinerVignettes();
    afficherPage();
    apres();
  });
}
function deplacerPage(d) {
  const j = E.ip + d;
  if (E.modeMaitre || j < 0 || j >= E.fiche.pages.length) return;
  avant();
  const p = E.fiche.pages.splice(E.ip, 1)[0];
  E.fiche.pages.splice(j, 0, p);
  E.ip = j;
  dessinerVignettes();
  majEtat();
  apres();
}
function renommerGroupes(items) {
  const m = new Map();
  for (const o of items) if (o.groupe) { if (!m.has(o.groupe)) m.set(o.groupe, nouvelId('g')); o.groupe = m.get(o.groupe); }
}

/* ==== editeur_texte.js ==== */
/* =====================================================================
   Éditeur : mise en forme du texte
   - pendant la saisie : s'applique à la sélection du texte ;
   - sur un cadre sélectionné : s'applique à tout son texte.
   ===================================================================== */
const TAILLES = [6, 7, 8, 9, 10, 10.5, 11, 12, 14, 16, 18, 20, 22, 24, 26, 28, 36, 48, 72];
const POLICES = ['Arial', 'Arial Black', 'Arial Narrow', 'Bookman Old Style', 'Calibri', 'Calibri Light', 'Cambria', 'Candara', 'Century Gothic',
  'Comic Sans MS', 'Consolas', 'Constantia', 'Corbel', 'Courier New', 'Franklin Gothic Medium', 'Garamond', 'Georgia', 'Impact',
  'Lucida Console', 'Lucida Sans Unicode', 'Palatino Linotype', 'Segoe Print', 'Segoe Script', 'Segoe UI', 'Tahoma', 'Times New Roman',
  'Trebuchet MS', 'Verdana', 'Webdings', 'Wingdings'];

function zoneDeSelection() {
  const s = window.getSelection();
  if (!s.rangeCount) return null;
  const n = s.getRangeAt(0).commonAncestorContainer;
  const el = n.nodeType === 1 ? n : n.parentElement;
  return el ? el.closest('.contenu[contenteditable="true"]') : null;
}

// applique fn(zone, toutLeTexte) au texte visé
function appliquerTexte(fn) {
  if (E.edition) {
    const o = objetParId(E.edition.id), el = elementObjet(E.edition.id);
    if (o && o.type === 'tableau' && E.cellules.length) {
      for (const i of E.cellules) {
        const z = $(`td[data-cellule="${i}"] .contenu`, el);
        if (z) { toutSelectionner(z); fn(z, true); }
      }
    } else {
      let z = zoneDeSelection();
      if (!z) { z = $('.contenu[contenteditable="true"]', el); if (z) toutSelectionner(z, true); }
      if (z) fn(z, false);
    }
    if (o && el) { if (o.type === 'texte') verifierDebordement(o, el); else apresRendu(o, el); }
    majSelectionUI();
    planifierEtatTexte();
    return;
  }
  let objs = selection().filter(o => o.type === 'texte' || o.type === 'tableau');
  if (!objs.length) return;
  // cadres chaînés : la mise en forme vaut pour tout l'enchaînement
  const chaines = new Set();
  for (const o of [...objs]) {
    if (!o.suivant && !o.precedent) continue;
    const ch = chaineDe(o);
    chaines.add(ch[0]);
    for (const x of ch) if (!objs.includes(x) && objetParId(x.id)) objs.push(x);
  }
  avant();
  for (const o of objs) {
    const el = elementObjet(o.id);
    if (!el) continue;
    for (const z of $$('.contenu', el)) {
      z.contentEditable = 'true';
      try { document.execCommand('styleWithCSS', false, true); } catch (e) { /* */ }
      toutSelectionner(z);

function paragraphesVises(z, tout) {
